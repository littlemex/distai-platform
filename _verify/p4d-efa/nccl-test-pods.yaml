apiVersion: v1
kind: Namespace
metadata:
  name: dp-p4d-efa-verify
---
apiVersion: v1
kind: Service
metadata:
  name: nccl
  namespace: dp-p4d-efa-verify
spec:
  clusterIP: None
  selector:
    app: nccl-efa-verify
  ports:
    - port: 22
      name: ssh
---
apiVersion: v1
kind: Secret
metadata:
  name: ssh-key
  namespace: dp-p4d-efa-verify
type: Opaque
stringData:
  id_rsa: "__ID_RSA__"
  id_rsa.pub: "__ID_RSA_PUB__"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nccl
  namespace: dp-p4d-efa-verify
spec:
  serviceName: nccl
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nccl-efa-verify
  template:
    metadata:
      labels:
        app: nccl-efa-verify
    spec:
      nodeSelector:
        distai.dev/nvidia-gpu-method: device-plugin
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nccl-efa-verify
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nccl
          image: public.ecr.aws/hpc-cloud/nccl-tests:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              mkdir -p /root/.ssh
              cp /etc/ssh-key/id_rsa /root/.ssh/id_rsa
              cp /etc/ssh-key/id_rsa.pub /root/.ssh/id_rsa.pub
              cat /root/.ssh/id_rsa.pub >> /root/.ssh/authorized_keys
              chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys
              echo "StrictHostKeyChecking no" >> /etc/ssh/ssh_config
              (service ssh start || /usr/sbin/sshd) || /usr/sbin/sshd -D &
              sleep infinity
          resources:
            limits:
              nvidia.com/gpu: "8"
              vpc.amazonaws.com/efa: "4"
            requests:
              nvidia.com/gpu: "8"
              vpc.amazonaws.com/efa: "4"
          volumeMounts:
            - name: ssh-key
              mountPath: /etc/ssh-key
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: ssh-key
          secret:
            secretName: ssh-key
            defaultMode: 0600
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
