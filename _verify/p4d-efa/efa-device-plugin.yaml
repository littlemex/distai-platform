apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-efa-k8s-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: aws-efa-k8s-device-plugin
  template:
    metadata:
      labels:
        name: aws-efa-k8s-device-plugin
    spec:
      nodeSelector:
        distai.dev/nvidia-gpu-method: device-plugin
      tolerations:
        - operator: Exists
      hostNetwork: true
      containers:
        - image: 602401143452.dkr.ecr.__REGION__.amazonaws.com/eks/aws-efa-k8s-device-plugin:v0.5.3
          name: aws-efa-k8s-device-plugin
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
