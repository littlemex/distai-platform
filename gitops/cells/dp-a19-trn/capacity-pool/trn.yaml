# Parameter file for cells.ApplicationSet.yaml's Git file generator
# (RFC #25 Decision 2/3), same shape as
# cells/example-cell/capacity-pool/cpu.yaml. The Trainium light-tier pool
# #28 section D verifies the device-plugin method on (a Layer 1 pod
# requesting aws.amazon.com/neuron: 1, then neuron-ls).
#
# pool.labels opts this pool's nodes into accel-neuron-device-plugin and
# nothing else (#19 Decision 2). The pool stays dynamically provisioned and
# device-plugin method: #19 E4c showed a dynamic DRA pool never initializes
# a Neuron node.
#
# pool.requirements replaces the chart default as a whole (Helm replaces
# lists): the chart's instance-category/instance-generation terms describe
# CPU families and are dropped; instance-family names trn2 directly, spot
# only (#28 acceptance criteria name a spot node explicitly; this PR drops
# the on-demand fallback rather than leave it un-asserted).
addon: capacity-pool-trn
wave: capacity
dir: gitops/charts/capacity-pool
namespace: kube-system
values:
  pool:
    name: trn
    labels:
      distai.dev/neuron-method: device-plugin
    requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["spot"]
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: karpenter.k8s.aws/instance-family
        operator: In
        values: ["trn2"]
valuesFrom:
  # The Cluster generator's own "name" field: this cell's cluster_name.
  - helmKey: clusterName
    param: name
  # infra/foundation output karpenter_node_role_name, carried by the
  # registration Secret (RFC #25 Decision 1/2) - the one annotation no
  # platform add-on reads.
  - helmKey: nodeRole
    annotationKey: distai.dev.annotations/karpenter-node-role
