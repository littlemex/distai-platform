# RFC #41 Decision 3. Opts this cell into the dcgm-exporter catalog entry
# (gitops/addon-catalog/dcgm-exporter/addon.yaml) -- dir/namespace/skipCrds
# below are byte-identical to that entry's own (checked by
# check_addon_catalog_sync.py); no values override needed for this
# fixture.
#
# A deliberate choice, not an implied default for every cell: a
# platform-optional component's whole point (Decision 1) is that a cell
# works the same with or without it, so copying this file as part of
# "copy gitops/cells/example-cell/" (gitops/README.md's own "Adding a
# cell" procedure) is this worked example demonstrating the opt-in
# mechanism's own rendering (Application generated, Healthy/Synced) --
# not a recommendation to keep every file example-cell happens to carry.
# This branch's own example-cell has only a CPU pool (#17), and
# dcgm-exporter schedules only onto NVIDIA GPU nodes (values.yaml's own
# nodeSelector), so the end-to-end case -- the DaemonSet's Pod actually
# Running and scraping a real GPU -- is `1.e2e.sh` step 14b's own GPU
# test fixture, not this marker on this cell (#63, filed as #59 item 6).
# A cell with a real NVIDIA pool (dp-a19-gpu-r3, #40/#52) is the one this
# marker should also be copied onto once this branch's own tree and
# #40/#52's chain share one history; it does not exist in this branch's
# own gitops/cells/ today. Delete this one file, and only this one, on a
# new cell that has no NVIDIA GPU capacity to monitor.
addon: dcgm-exporter
fromCatalog: dcgm-exporter
dir: gitops/charts/dcgm-exporter
namespace: dcgm-exporter
wave: optional-1
