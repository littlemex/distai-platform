# RFC #41 Decision 3. Opts this cell into the jobset catalog entry
# (gitops/addon-catalog/jobset/addon.yaml, issue #34) -- dir/namespace/
# skipCrds below are byte-identical to that entry's own (checked by
# gitops/tests/check_addon_catalog_sync.py). wave: optional-1 because
# this entry's only dependsOn, jobset-crd, is core (gitops/addons/), so
# no earlier optional wave needs to run first (gitops/README.md's own
# Ordering table, "addons-optional" row).
#
# This cell exists only for issue #34's own real-hardware verification
# (examples/training/tests/1.e2e.sh): a light-tier spot GPU pool
# (capacity-pool/gpu.yaml) for a two-GPU pytorch-ddp JobSet, and this
# marker so the JobSet controller and webhook actually run here.
addon: jobset
fromCatalog: jobset
dir: gitops/charts/jobset
namespace: jobset-system
skipCrds: true
wave: optional-1
# #110: see gitops/addon-catalog/jobset/addon.yaml's own pinReleaseNameToCell
# comment -- this is the field addons-optional.ApplicationSet.yaml
# actually reads (the catalog entry is documentation only).
pinReleaseNameToCell: true
