# RFC #41 Decision 3. Opts this cell into the sharedfs catalog entry
# (gitops/addon-catalog/sharedfs/addon.yaml, #18) -- dir/namespace below
# are byte-identical to that entry's own
# (gitops/tests/check_addon_catalog_sync.py's check (1)). image is the
# one overridableKey that entry declares (check (4)): read from the
# cell-registration Secret's own annotation, set by
# gitops/bootstrap/sharedfs-image-publish.sh after infra/foundation's
# var.shared_fsx_lustre is applied and gitops/bootstrap/bootstrap.sh has
# run once - never a literal value here (it names this cell's own ECR
# repository).
addon: sharedfs
fromCatalog: sharedfs
dir: gitops/charts/sharedfs-controller
namespace: sharedfs-system
wave: optional-1
valuesFrom:
  - helmKey: image
    annotationKey: distai.dev.annotations/sharedfs-controller-image
