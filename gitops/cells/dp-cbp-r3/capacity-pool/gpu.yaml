# Parameter file for cells.ApplicationSet.yaml's Git file generator
# (RFC #25 Decision 2/3), dp-cbp-r3's own cell for CB dry-run #3
# (verify/cb-batch), unique per the OWNER-BRIEF hard safety rule -- never
# reuses or edits another owner's cell, e.g. dp-a19-gpu. Copied from
# dp-cbp-r2's own working config (on-demand g4dn.2xlarge, confirmed to get
# a node reliably after three consecutive spot exhaustions there) so this
# cell's own combined gpuQuota + step27 validation run does not also have
# to fight capacity.
#
# Two cheap GPU instances (g4dn.2xlarge, 1 GPU each) so the Node A/Node B
# per-node-lane and 2-node isolation prep items (plan.md section 2, "three
# specific isolation mechanisms") can actually be exercised with two real
# nodes during this dry run, not just unit-tested in isolation.
addon: capacity-pool-gpu
wave: capacity
dir: gitops/charts/capacity-pool
namespace: kube-system
values:
  pool:
    name: gpu
    labels:
      distai.dev/nvidia-gpu-method: device-plugin
    # on-demand, g4dn.2xlarge: THIRD consecutive spot exhaustion on
    # dp-cbp-r2 (2026-11-19 22:55-23:32 g6e.2xlarge, 2026-11-20 00:55-01:25
    # g6e.2xlarge, 2026-11-20 02:43-03:14 g4dn.2xlarge -- launch-
    # ledger.jsonl), across two instance families and three AZs in
    # ap-northeast-1. Confirmed via CloudTrail CreateFleet errorSet
    # (UnfulfillableCapacity on every AZ tried), consistent with a
    # region-wide GPU spot crunch, not a per-type anomaly or a config
    # defect. Per account policy, use on-demand. #28's own accel
    # acceptance criteria 2/3 (which assert a specific capacity-type) are
    # now checked via the explicit EXPECT_CAPACITY_TYPE=on-demand input to
    # gitops/tests/1.e2e.sh -- still a hard assertion, never relaxed.
    requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: karpenter.k8s.aws/instance-family
        operator: In
        values: ["g4dn"]
      - key: node.kubernetes.io/instance-type
        operator: In
        values: ["g4dn.2xlarge"]
    # 150Gi root volume: the 2026-11-20 dry-run failure (disk-pressure
    # eviction from a multi-GB CUDA/EFA/NCCL check image on an undersized
    # default root volume, which Karpenter then read as an empty node and
    # consolidated) is fixed at the chart level via pool.rootVolumeSizeGi
    # (gitops/charts/capacity-pool/templates/ec2nodeclass.yaml) -- the
    # shared mechanism also used by branch fix/capacity-pool-root-volume
    # (commit 9635e46), which hit the same chart-level gap independently
    # on a real trn2.3xlarge failure (#28).
    rootVolumeSizeGi: "150Gi"
    # 10m, not the chart default 60s: gives a health-check pod's image
    # pull room to finish before Karpenter considers the node for
    # consolidation (same incident).
    disruption:
      consolidationPolicy: WhenEmptyOrUnderutilized
      consolidateAfter: 10m
    limits:
      # Two g4dn.2xlarge nodes (8 vCPU each) plus headroom for one retry.
      cpu: "20"
valuesFrom:
  - helmKey: clusterName
    param: name
  - helmKey: nodeRole
    annotationKey: distai.dev.annotations/karpenter-node-role
