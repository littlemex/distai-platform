{{- if .Values.enabled }}
# Same shape as gitops/charts/capacity-pool/templates/ec2nodeclass.yaml:
# subnets and security group selected by the karpenter.sh/discovery tag
# the foundation layer sets (never a hand-picked ID), IMDSv2 required with
# hop limit 1 set explicitly rather than left to Karpenter's own default.
# The whole document is gated on .Values.enabled (RFC #41 Decision 4
# Finding 1, option (b) vs (a) -- see values.yaml).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ required "pool.name is required" .Values.pool.name | quote }}
spec:
  role: {{ required "nodeRole is required (distai.dev.annotations/karpenter-node-role)" .Values.nodeRole | quote }}
  amiFamily: {{ .Values.amiFamily }}
  amiSelectorTerms:
{{ toYaml .Values.amiSelectorTerms | indent 4 }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
{{- end }}
