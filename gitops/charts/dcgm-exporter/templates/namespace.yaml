# RFC #41 Decision 4 (Pod Security level stated, never implicit). The
# upstream DaemonSet runs as root with the SYS_ADMIN capability and a
# hostPath mount of the kubelet pod-resources socket, which Pod Security
# Admission's baseline level forbids -- so this namespace is labelled
# enforce=privileged on itself only. Rendered by the chart, rather than
# left to the bare namespace CreateNamespace=true makes, so the label is
# there from the first sync instead of added by hand afterwards.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
