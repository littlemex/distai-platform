# No default is safe for clusterName or nodeRole: both are cell-specific and
# come from a cells/<cluster-name>/capacity-pool/*.yaml parameter file via
# cells.ApplicationSet.yaml's valuesFrom (clusterName from the Cluster
# generator's own "name" param; nodeRole from the registration Secret's
# distai.dev.annotations/karpenter-node-role annotation - RFC #25 Decision
# 2). This was previously described as "the one Terraform output no
# platform add-on reads"; #41's optional-pool (a platform add-on, core
# tier) reads exactly this annotation too (#63, filed as #58) - the
# annotation is not cell-specific-parameter-file-only, only nodeRole's
# *value* is cell-specific.
clusterName: ""
nodeRole: ""

pool:
  # Shared by the NodePool, its EC2NodeClass and the matching ResourceFlavor.
  name: ""

  # The one capacity type this pool launches (#17's -rsv/-od/-flex pools).
  # The chart generates the NodePool's karpenter.sh/capacity-type
  # requirement from this field:
  #   on-demand -> ["on-demand"]
  #   reserved  -> ["reserved"] (never mixed with on-demand; needs
  #                reservation.tags below)
  #   flex      -> ["spot", "on-demand"]
  # Any other value fails the render.
  capacityType: on-demand

  # Every other scheduling requirement. Must not contain
  # karpenter.sh/capacity-type (the render fails if it does): capacityType
  # above is the only place the capacity type is declared.
  requirements:
    - key: kubernetes.io/arch
      operator: In
      values: ["amd64"]
    - key: karpenter.k8s.aws/instance-category
      operator: In
      values: ["c", "m", "r"]
    - key: karpenter.k8s.aws/instance-generation
      operator: Gt
      values: ["5"]

  limits:
    cpu: "32"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s

# Used only when pool.capacityType is "reserved": renders
# EC2NodeClass.spec.capacityReservationSelectorTerms as one term
# [{tags, instanceMatchCriteria}]. Reservations are selected by tag, not by
# ID, so a replacement reservation (every Capacity Block purchase is one) is
# picked up as long as it carries the same tags. tags must be non-empty when
# capacityType is "reserved" (the render fails otherwise).
# instanceMatchCriteria defaults to "targeted": an "open" reservation can be
# consumed by any matching On-Demand launch in the account, not only by
# this pool.
reservation:
  tags: {}
  instanceMatchCriteria: targeted

# Optional accelerator-class fields shared by every accelerator vendor
# (#19, #22). Values only: nothing here installs a device plugin or
# enforces anything; left empty (the default), none of it renders.
#   resourceName  - provenance annotation distai.dev/accelerator-resource-name
#                   on the NodePool and the ResourceFlavor (for example
#                   nvidia.com/gpu or aws.amazon.com/neuron); no template
#                   branches on its value.
#   taint         - a NodePool taint, mirrored as a ResourceFlavor
#                   toleration. Rendered only when taint.key is set; effect
#                   must then be NoSchedule, PreferNoSchedule or NoExecute.
#   methodLabel   - a label on the NodePool's node template, for an
#                   advertiser DaemonSet to select nodes by. Rendered only
#                   when methodLabel.key is set.
accelerator:
  resourceName: ""
  taint:
    key: ""
    value: ""
    effect: ""
  methodLabel:
    key: ""
    value: ""

# Optional team-exclusive taint (#22 Decision 3), rendered exactly like
# accelerator.taint: a NodePool taint mirrored as a ResourceFlavor
# toleration, only when teamTaint.key is set. A value only: nothing in this
# chart stops another team's ClusterQueue from listing this ResourceFlavor.
tenancy:
  teamTaint:
    key: ""
    value: ""
    effect: ""

# Pinned, not "latest": confirmed against the public SSM parameter
# /aws/service/eks/optimized-ami/1.37/amazon-linux-2023/x86_64/standard/recommended/release_version
# (value 1.37.1-20261112 on 2026-11-19), the same EKS-optimized AL2023
# release the foundation e2e's own, now-removed stand-in Karpenter install
# pinned (al2023@v20261112) -- a reviewed diff bumps this, never an
# unattended "latest" pull on every node launch.
amiFamily: AL2023
amiSelectorTerms:
  - alias: al2023@v20261112
