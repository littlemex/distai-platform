# No default is safe for clusterName or nodeRole: both are cell-specific and
# come from a cells/<cluster-name>/capacity-pool/*.yaml parameter file via
# cells.ApplicationSet.yaml's valuesFrom (clusterName from the Cluster
# generator's own "name" param; nodeRole from the registration Secret's
# distai.dev.annotations/karpenter-node-role annotation, the one Terraform
# output no platform add-on reads - RFC #25 Decision 2).
clusterName: ""
nodeRole: ""

pool:
  # Shared by the NodePool, its EC2NodeClass and the matching ResourceFlavor.
  name: ""

  # CPU-only, on-demand, amd64: the minimal skeleton this PR ships. #17's PR
  # adds spot/flex requirements and per-capacity-type pools (-rsv/-od/-flex)
  # on top of this same chart.
  requirements:
    - key: karpenter.sh/capacity-type
      operator: In
      values: ["on-demand"]
    - key: kubernetes.io/arch
      operator: In
      values: ["amd64"]
    - key: karpenter.k8s.aws/instance-category
      operator: In
      values: ["c", "m", "r"]
    - key: karpenter.k8s.aws/instance-generation
      operator: Gt
      values: ["5"]

  limits:
    cpu: "32"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s

  # Empty (default): no extra ENI is requested, matching today's CPU-only
  # skeleton exactly (no behavior change for an existing pool that does not
  # set this). A pool targeting an EFA-capable instance type (for example
  # the single-network-card g7/g7e sizes, which carry exactly one EFA
  # interface) sets this to request it; otherwise the instance boots
  # without an EFA device even though the type supports one (see
  # ec2nodeclass.yaml's own comment). Example for one EFA device on
  # network card 0, the only shape a single-network-card instance type
  # supports:
  #   networkInterfaces:
  #     - networkCardIndex: 0
  #       deviceIndex: 0
  #       interfaceType: interface
  #     - networkCardIndex: 0
  #       deviceIndex: 1
  #       interfaceType: efa-only
  #
  # A two-network-card type (two EFA interfaces, for example g7.48xlarge or
  # p5en.48xlarge) needs one efa-only interface per card instead - the only
  # way two separate EFA-requesting Pods (for example disagg-pd's prefill
  # and decode under placement.sameNodeMeasurement) can land on the SAME
  # node at all, since the EFA device plugin allocates one physical
  # interface per Pod and never gives the same interface to two Pods
  # (confirmed on real hardware, g7.48xlarge, 2026-11-20 - a single-
  # network-card size left the second Pod Pending forever):
  #   networkInterfaces:
  #     - networkCardIndex: 0
  #       deviceIndex: 0
  #       interfaceType: interface
  #     - networkCardIndex: 0
  #       deviceIndex: 1
  #       interfaceType: efa-only
  #     - networkCardIndex: 1
  #       deviceIndex: 0
  #       interfaceType: efa-only
  networkInterfaces: []

  # EC2NodeClass.spec.blockDeviceMappings' root volume size, as a plain
  # Kubernetes quantity string (e.g. "100Gi" or "150Gi"). Empty by
  # default: the EC2NodeClass renders no blockDeviceMappings at all, so a
  # node's root volume stays whatever the AMI's own default is -- no
  # behavior change for an existing pool that does not set this. Set it
  # when a pool's own workloads need more room than that default leaves
  # free for container images. Confirmed necessary on real hardware: a
  # g7.8xlarge node's default root volume ran out of space mid-pull of a
  # CUDA-bundled vLLM image ("no space left on device" while extracting a
  # layer); kubelet's own disk-pressure eviction then turned that into a
  # pod that was genuinely Scheduled and bound, evicted, and whose
  # now-pod-less node Karpenter reclaimed as idle shortly after - a
  # failure that reads, from Karpenter's own side alone, as an unrelated
  # empty-node consolidation.
  rootVolumeSizeGi: ""

# Pinned, not "latest": confirmed against the public SSM parameter
# /aws/service/eks/optimized-ami/1.37/amazon-linux-2023/x86_64/standard/recommended/release_version
# (value 1.37.1-20261112 on 2026-11-19), the same EKS-optimized AL2023
# release the foundation e2e's own, now-removed stand-in Karpenter install
# pinned (al2023@v20261112) -- a reviewed diff bumps this, never an
# unattended "latest" pull on every node launch.
amiFamily: AL2023
amiSelectorTerms:
  - alias: al2023@v20261112
