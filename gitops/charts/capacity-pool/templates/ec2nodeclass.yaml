# EC2NodeClass selects the cell's own subnets and security group by the
# karpenter.sh/discovery tag the foundation layer already sets on them
# (infra/foundation/vpc.tf, infra/foundation/eks.tf) - never a hand-picked
# subnet or security group ID. metadataOptions is set explicitly (IMDSv2
# required, hop limit 1) rather than left to Karpenter's own default, per
# the foundation README's own note that every EC2NodeClass should do this
# rather than rely on the default staying what it is today.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ required "pool.name is required" .Values.pool.name | quote }}
spec:
  role: {{ required "nodeRole is required (distai.dev.annotations/karpenter-node-role)" .Values.nodeRole | quote }}
  amiFamily: {{ .Values.amiFamily }}
  amiSelectorTerms:
{{ toYaml .Values.amiSelectorTerms | indent 4 }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
{{- if eq .Values.pool.capacityType "reserved" }}
{{- /*
Reserved pools select their reservation by tag (#17), never by ID, and
match it "targeted" by default.
*/}}
{{- if empty .Values.reservation.tags }}
{{- fail "reservation.tags must select at least one tag when pool.capacityType is reserved" }}
{{- end }}
{{- if not (has .Values.reservation.instanceMatchCriteria (list "targeted" "open")) }}
{{- fail (printf "reservation.instanceMatchCriteria must be targeted or open (got %q)" (toString .Values.reservation.instanceMatchCriteria)) }}
{{- end }}
  capacityReservationSelectorTerms:
    - tags:
{{- range $k, $v := .Values.reservation.tags }}
        {{ $k | quote }}: {{ $v | toString | quote }}
{{- end }}
      instanceMatchCriteria: {{ .Values.reservation.instanceMatchCriteria }}
{{- end }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
