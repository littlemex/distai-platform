# EC2NodeClass selects the cell's own subnets and security group by the
# karpenter.sh/discovery tag the foundation layer already sets on them
# (infra/foundation/vpc.tf, infra/foundation/eks.tf) - never a hand-picked
# subnet or security group ID. metadataOptions is set explicitly (IMDSv2
# required, hop limit 1) rather than left to Karpenter's own default, per
# the foundation README's own note that every EC2NodeClass should do this
# rather than rely on the default staying what it is today.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ required "pool.name is required" .Values.pool.name | quote }}
spec:
  role: {{ required "nodeRole is required (distai.dev.annotations/karpenter-node-role)" .Values.nodeRole | quote }}
  amiFamily: {{ .Values.amiFamily }}
  amiSelectorTerms:
{{ toYaml .Values.amiSelectorTerms | indent 4 }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
{{- if eq .Values.pool.capacityType "reserved" }}
{{- /*
Reserved pools select their reservation by tag (#17), never by ID, and
match it "targeted" by default.
*/}}
{{- $r := default (dict) .Values.reservation }}
{{- if empty $r.tags }}
{{- fail "reservation.tags must select at least one tag when pool.capacityType is reserved" }}
{{- end }}
{{- if not (has $r.instanceMatchCriteria (list "targeted" "open")) }}
{{- fail (printf "reservation.instanceMatchCriteria must be targeted or open (got %q)" (toString $r.instanceMatchCriteria)) }}
{{- end }}
  capacityReservationSelectorTerms:
    - tags:
{{- range $k, $v := $r.tags }}
{{- if or (empty $k) (empty (toString $v)) }}
{{- fail "reservation.tags must not contain an empty key or value" }}
{{- end }}
        {{ $k | quote }}: {{ $v | toString | quote }}
{{- end }}
      instanceMatchCriteria: {{ $r.instanceMatchCriteria }}
{{- end }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  {{- /*
    EFA (and any other non-default ENI attachment) is opt-in and empty by
    default: Karpenter does not attach an EFA device on its own just
    because the selected instance type supports one (confirmed against the
    upstream NodeClasses doc, 2026-11-20 - EC2NodeClass.spec.networkInterfaces
    is the only field that requests it). A pool that targets an
    EFA-capable instance type without setting this still boots, but with
    no EFA device at all, which then fails silently at the pod level (the
    EFA device plugin simply advertises zero of the extended resource the
    pod's EFA request names) rather than at node launch. Each entry must
    repeat interfaceType even when Karpenter's own default differs per
    networkCardIndex, since this chart's values are a flat list applied
    as-is - see values.yaml's own comment for the one-EFA-device shape
    this pairs with (networkCardIndex 0, deviceIndex 0 "interface" +
    deviceIndex 1 "efa-only").
  */}}
  {{- with .Values.pool.networkInterfaces }}
  networkInterfaces:
{{ toYaml . | indent 4 }}
  {{- end }}
