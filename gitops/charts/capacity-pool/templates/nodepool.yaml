# One NodePool per release of this chart (RFC #25 Decision 9: a minimal
# CPU-only skeleton - one capacity type, no -rsv/-od/-flex ordering across
# several NodePools of this same pool name; #17's own PR adds that on top
# of this chart, unchanged in name or shape).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.pool.name | quote }}
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ .Values.pool.name | quote }}
      requirements:
{{ toYaml .Values.pool.requirements | indent 8 }}
      terminationGracePeriod: 24h0m0s
  limits:
{{ toYaml .Values.pool.limits | indent 4 }}
  disruption:
    consolidationPolicy: {{ .Values.pool.disruption.consolidationPolicy }}
    consolidateAfter: {{ .Values.pool.disruption.consolidateAfter | quote }}
