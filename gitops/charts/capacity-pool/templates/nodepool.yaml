{{- /*
pool.capacityType drives the karpenter.sh/capacity-type requirement
(capacity-pool.requirements in _helpers.tpl): one capacity type per
release, so -rsv, -od and -flex are three releases of this chart.
*/}}
# One NodePool per release of this chart (RFC #17: one NodePool per
# ResourceFlavor; RFC #25 Decision 9: this chart's own name and the three
# kinds it renders do not change between the minimal CPU-only skeleton and
# the -rsv/-od/-flex extension, only the values do).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.pool.name | quote }}
{{- with include "capacity-pool.annotations" . }}
{{ . | indent 2 }}
{{- end }}
spec:
  template:
{{- $methodLabel := (default (dict) .Values.accelerator).methodLabel }}
{{- $hasMethodLabel := and $methodLabel $methodLabel.key }}
{{- $hasEfa := gt (len (default (list) .Values.pool.networkInterfaces)) 0 }}
{{- if or $hasMethodLabel $hasEfa }}
    metadata:
      labels:
{{- if $hasMethodLabel }}
        {{ $methodLabel.key | quote }}: {{ $methodLabel.value | toString | quote }}
{{- end }}
{{- if $hasEfa }}
        # Set only when this pool's own EC2NodeClass actually attaches EFA network
        # interfaces (pool.networkInterfaces non-empty, #50) -- not derived from the
        # accelerator method label or the instance type, both of which a pool can
        # carry without ever requesting an EFA interface. accel-efa-device-plugin-*
        # (#19/#50) AND into this label on top of the vendor method label, so a
        # method-labeled pool that never configured EFA interfaces never gets that
        # DaemonSet's Pod at all -- confirmed on real hardware (distai-platform PR
        # for accel-efa-device-plugin-nvidia/-neuron) that the pinned
        # aws-efa-k8s-device-plugin chart's own Pod crash-loops on an EFA-capable
        # instance type with zero physical EFA interfaces, which is exactly the
        # combination this label is designed to keep that Pod away from.
        distai.dev/efa-attached: "true"
{{- end }}
{{- end }}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ .Values.pool.name | quote }}
      requirements:
{{ include "capacity-pool.requirements" . | fromJsonArray | toYaml | indent 8 }}
{{- with include "capacity-pool.taints" . | fromJsonArray }}
      taints:
{{ toYaml . | indent 8 }}
{{- end }}
      terminationGracePeriod: 24h0m0s
  limits:
{{ toYaml .Values.pool.limits | indent 4 }}
  disruption:
    consolidationPolicy: {{ .Values.pool.disruption.consolidationPolicy }}
    consolidateAfter: {{ .Values.pool.disruption.consolidateAfter | quote }}
