apiVersion: v2
name: capacity-pool
description: >-
  One Karpenter NodePool, its EC2NodeClass and the matching Kueue
  ResourceFlavor, as a single admin-authored unit (RFC #25 Decision 9). One
  release declares one capacity type (on-demand, reserved or flex), so the
  -rsv, -od and -flex pools of #17 are three releases of this chart;
  reserved pools select their Capacity Reservation by tag.
type: application
version: 0.2.0
appVersion: "1.0.0"
