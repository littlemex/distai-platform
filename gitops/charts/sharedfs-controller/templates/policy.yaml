# Ported, with the edits noted below, from littlemex/sharedfs's own
# `kubectl kustomize config/default` output at the pinned commit
# c19eb1fd6b8a1d493081ec8b862b02955b015299 (#18's own citation:
# https://github.com/littlemex/sharedfs/tree/c19eb1fd6b8a1d493081ec8b862b02955b015299).
# sharedfs ships no Helm chart of its own (Kustomize only); this is that
# same, tested manifest set, not a re-derivation from its Go source. Names,
# the sharedfs-system namespace and every CEL expression below are kept
# byte-for-byte: the ValidatingAdmissionPolicy objects in policy.yaml
# hardcode `system:serviceaccount:sharedfs-system:sharedfs-controller-manager`,
# `sfs-prep-`/`sfs-quota-` name prefixes and the `sharedfs-guard` ConfigMap
# name as literal strings in upstream's own source, not as values this
# chart could safely template without diverging from the behavior upstream
# itself tests - changing any of them here without changing them upstream
# too would silently break the admission guard. Edits from the literal
# render, each also noted at its own spot below:
#  1. The `app.kubernetes.io/managed-by: kustomize` label is corrected to
#     `helm` (cosmetic provenance only, no object reads it).
#  2. The three ValidatingAdmissionPolicy and three
#     ValidatingAdmissionPolicyBinding objects (policy.yaml) each lost a
#     `namespace: sharedfs-system` field that kustomize's own namespace
#     transformer had added: both kinds are Cluster-scoped (confirmed
#     against their own CRD - admissionregistration.k8s.io/v1 ships no
#     Namespaced ValidatingAdmissionPolicy[Binding] kind), so the API
#     server ignores that field outright; dropped here to match this
#     platform's own existing ValidatingAdmissionPolicy objects
#     (gitops/bootstrap/team-rbac-guard.yaml), which carry no such field.
#  3. The Deployment's image, replica count and the `sharedfs-guard`
#     ConfigMap's `preparerRepository` are templated from .Values.image
#     (required, no default: see this chart's own README) - upstream has
#     no Helm values to template them from at all.
#  4. A `--preparer-image` flag is added to the Deployment's own args
#     (absent from upstream's own default manifest, which otherwise
#     refuses to start the moment any FilesystemShare sets `provision` -
#     exactly what gitops/charts/sharedfs-shares' checkpoints/datasets
#     shares both do): set to the same value as the container's own image,
#     matching the README's own documented default ("the controller's own
#     image, pinned to the digest it runs").

apiVersion: v1
data:
  preparerRepository: {{ index (splitList "@" .Values.image) 0 }}
  quotaRepository: {{ index (splitList "@" .Values.image) 0 }}
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: sharedfs
  name: sharedfs-guard
  namespace: sharedfs-system
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/name: sharedfs
  name: sharedfs-controller-guard-claims
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager'
    name: by-controller
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - DELETE
      resources:
      - persistentvolumeclaims
  validations:
  - expression: |-
      request.operation == 'DELETE' ?

        (oldObject.metadata.name.startsWith('sfs-prep-') || oldObject.metadata.name.startsWith('sfs-quota-') ||
         (has(oldObject.spec.volumeName) && oldObject.spec.volumeName.startsWith('sfs-'))) :
        (object.metadata.namespace in ['sharedfs-system', 'sharedfs-quota'] &&
         (object.metadata.name.startsWith('sfs-prep-') || object.metadata.name.startsWith('sfs-quota-')) &&
         object.spec.volumeName == object.metadata.name)
    message: the sharedfs controller may only create its internal claims, bound by
      name to their volume, and delete claims bound to sharedfs volumes
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/name: sharedfs
  name: sharedfs-controller-guard-pods
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager'
    name: by-controller
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  validations:
  - expression: |-
      (object.metadata.namespace == 'sharedfs-system' && object.metadata.name.startsWith('sfs-prep-') &&

        object.spec.containers.all(c, c.image.split('@')[0] == params.data.preparerRepository &&
          c.securityContext.capabilities.add.all(a, a == 'CHOWN'))) ||
      (object.metadata.namespace == 'sharedfs-quota' && object.metadata.name.startsWith('sfs-quota-') &&

        object.spec.containers.all(c, c.image.split('@')[0] == params.data.quotaRepository &&
          c.securityContext.capabilities.add.all(a, a == 'SYS_ADMIN')))
    message: the sharedfs controller may only run its preparer and quota pods, from
      the configured repositories, with their capabilities
  - expression: |-
      object.spec.containers.size() == 1 && object.spec.containers.all(c, c.image.contains('@sha256:') &&

        has(c.securityContext) && has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) && c.securityContext.capabilities.drop.exists(d, d == 'ALL') &&
        !(has(c.securityContext.privileged) && c.securityContext.privileged) &&
        has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation) &&
      !(has(object.spec.hostNetwork) && object.spec.hostNetwork) && !(has(object.spec.hostPID) && object.spec.hostPID) && !(has(object.spec.hostIPC) && object.spec.hostIPC) && has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) && object.spec.securityContext.seccompProfile.type == 'RuntimeDefault' && !has(object.spec.initContainers) && !has(object.spec.ephemeralContainers) && has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken && has(object.spec.volumes) && object.spec.volumes.size() == 1 && object.spec.volumes.all(v, has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == object.metadata.name) && !has(object.spec.securityContext.sysctls) && object.spec.containers.all(c, !has(c.command) && !has(c.env) && !has(c.envFrom) &&

        has(c.args) && c.args.size() > 0 && c.args[0] in ['prepare-directory', 'set-quota'] &&
        has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem &&
        (!has(c.securityContext.seccompProfile) || c.securityContext.seccompProfile.type == 'RuntimeDefault') &&
        !has(c.securityContext.procMount) && !has(c.securityContext.appArmorProfile) &&
        !has(c.securityContext.seLinuxOptions) && !has(c.securityContext.windowsOptions) &&
        !has(c.lifecycle) && !has(c.livenessProbe) && !has(c.readinessProbe) && !has(c.startupProbe)) &&
      object.spec.restartPolicy == 'Never' && has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds <= 600
    message: a task pod must be one container by digest running the controller's binary
      (no command, a task argument, no environment, no hooks or probes), never restarted,
      with a deadline, dropping all other capabilities, without privilege, host namespaces,
      sysctls or a token, read-only root, RuntimeDefault seccomp, mounting only its
      own internal claim
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/name: sharedfs
  name: sharedfs-controller-guard-volumes
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == 'system:serviceaccount:sharedfs-system:sharedfs-controller-manager'
    name: by-controller
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      - DELETE
      resources:
      - persistentvolumes
  validations:
  - expression: |-
      request.operation == 'DELETE' ? oldObject.metadata.name.startsWith('sfs-') : (object.metadata.name.startsWith('sfs-') && has(object.spec.csi) &&

       object.spec.csi.driver in ['fsx.csi.aws.com', 'fsx.openzfs.csi.aws.com'] &&
       object.spec.csi.volumeHandle.startsWith('sharedfs:') &&
       has(object.spec.claimRef) && has(object.spec.claimRef.uid) &&
       ((!object.metadata.name.startsWith('sfs-prep-') && !object.metadata.name.startsWith('sfs-quota-')) ||
        (object.spec.claimRef.namespace in ['sharedfs-system', 'sharedfs-quota'] && object.spec.claimRef.name == object.metadata.name)))
    message: 'the sharedfs controller may only create, change and delete its own CSI
      volumes: supported drivers, named sfs-*, with a sharedfs handle, reserved for
      a claim by UID'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/name: sharedfs
  name: sharedfs-controller-guard-claims
spec:
  policyName: sharedfs-controller-guard-claims
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/name: sharedfs
  name: sharedfs-controller-guard-pods
spec:
  paramRef:
    name: sharedfs-guard
    namespace: sharedfs-system
    parameterNotFoundAction: Deny
  policyName: sharedfs-controller-guard-pods
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/name: sharedfs
  name: sharedfs-controller-guard-volumes
spec:
  policyName: sharedfs-controller-guard-volumes
  validationActions:
  - Deny
