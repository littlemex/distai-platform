---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: sharedfs
  name: sharedfs-share-viewer
rules:
- apiGroups:
  - sharedfs.io
  resources:
  - filesystemshares
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: sharedfs
  name: sharedfs-leader-election-rolebinding
  namespace: sharedfs-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sharedfs-leader-election-role
subjects:
- kind: ServiceAccount
  name: sharedfs-controller-manager
  namespace: sharedfs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: sharedfs
  name: sharedfs-manager-rolebinding
  namespace: sharedfs-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sharedfs-manager-role
subjects:
- kind: ServiceAccount
  name: sharedfs-controller-manager
  namespace: sharedfs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: sharedfs
  name: sharedfs-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sharedfs-manager-role
subjects:
- kind: ServiceAccount
  name: sharedfs-controller-manager
  namespace: sharedfs-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sharedfs-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sharedfs-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: sharedfs-controller-manager
  namespace: sharedfs-system
