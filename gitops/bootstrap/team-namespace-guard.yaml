# gitops/bootstrap/team-namespace-guard.yaml - RFC #22 Decision 10 H11,
# issue #57 item 1's own remaining PR #66 caveat.
#
# Why this exists: gitops/bootstrap/team-rbac-guard.yaml's own
# matchConstraints.namespaceSelector decides which namespaces that
# guard constrains at all by checking ONE thing: does the namespace
# carry the distai.dev/team label (operator: Exists)? PR #66's own
# text, once that guard shipped, named one thing it had not checked: an
# Argo CD Application's own spec.syncPolicy.managedNamespaceMetadata
# (paired with syncOptions: [CreateNamespace=true]) lets that
# Application's own sync set the destination namespace's labels and
# annotations on every sync -- a mechanism that runs through Argo CD's
# own capability-wide sync identity exactly like every object this
# namespace's own team Application syncs, not through the team's own,
# narrower ServiceAccount
# (infra/foundation/tests/4.argocd-impersonation.sh's own check 7
# already confirmed every sync uses that capability identity, never the
# team's). By code reading alone, a team's own Application, inside its
# own AppProject, targeting its own existing namespace, looked free to
# set managedNamespaceMetadata to any labels it likes -- including,
# simply by never naming distai.dev/team in that field, or by
# explicitly re-declaring it with a different value. If that label
# disappeared or changed, team-rbac-guard.yaml's own namespaceSelector
# would stop matching this namespace (or match the wrong team's own
# namespaceSelector-adjacent assumptions) and every Role/RoleBinding
# rule in it would go dark -- the same escalation team-rbac-guard.yaml
# exists to stop, reached through the one surface that guard's own
# resourceRules (which match only "roles"/"rolebindings", never
# "namespaces") cannot see. gitops/bootstrap/team-onboard.sh's own
# pod-security.kubernetes.io/enforce: restricted label on the same
# Namespace object is reachable the same way and matters just as much
# (that label is what actually stops a privileged DaemonSet or a
# hostNetwork Pod, a gap team-rbac-guard.yaml's own header already
# states no RBAC-content rule can reach).
#
# Real-hardware result (infra/foundation/tests/4.argocd-impersonation.sh's
# own checks 10-11): check 10 ran one Application whose
# managedNamespaceMetadata omits distai.dev/team and explicitly sets
# pod-security.kubernetes.io/enforce: privileged, once with
# team-namespace-guard-binding deleted and once with it restored. On
# both runs neither label actually changed -- Argo CD's own
# managedNamespaceMetadata reconciliation on the EKS managed Argo CD
# capability did not attempt to overwrite either pre-existing label at
# all, so check 10 did not exercise this policy's own denial either
# time (a fact, not a theory: this is the one thing check 10's own
# result establishes). That result does not make the code-reading
# analysis above wrong, and it is specific to this one capability and
# this one Argo CD behavior, observed once -- not a guarantee that
# every Argo CD version, every self-hosted install, or every other
# write path (a different controller, a human `kubectl edit`, a future
# chart feature) will behave the same way. Check 11 tests this policy
# directly with `kubectl label` (no Argo CD at all), the same
# delete-the-Binding / restore-the-Binding mutation-check shape checks
# 8-9 already use for team-rbac-guard.yaml, and confirms the policy
# itself denies both an explicit value override of
# pod-security.kubernetes.io/enforce and an outright removal of
# distai.dev/team, regardless of whether Argo CD's own reconciliation
# ever reaches for either.
#
# The fix is the same shape as team-rbac-guard.yaml's own: a
# ValidatingAdmissionPolicy that runs on every UPDATE of a Namespace
# object regardless of the caller's own identity (admission runs after
# authorization already let the request through, so it does not matter
# that the caller here is Argo CD's own capability-wide identity, not
# the team's). It does not forbid managedNamespaceMetadata, or Argo CD
# managing a team namespace's metadata at all -- a team's own
# Application may still add, through that field, any label or
# annotation it likes, including ones that did not exist before. It
# forbids three things on a namespace that already carries
# distai.dev/team: removing or changing the VALUE of distai.dev/team
# itself; removing or changing the VALUE of
# pod-security.kubernetes.io/enforce once that namespace carries it;
# and introducing pod-security.kubernetes.io/enforce-version at all
# (rule 3's own comment below explains why that one is an outright
# ban, not a "once set" check). A namespace that does not yet carry
# distai.dev/team is unaffected by any rule here (matchConditions below
# gates all three on that one fact), and this policy's own CREATE path
# is never reached at all (a Namespace is created once, by
# team-onboard.sh, already carrying the label; every later write is an
# UPDATE).
#
#   1. distai.dev/team may not be removed or have its value changed.
#      This is the label gitops/bootstrap/team-rbac-guard.yaml's own
#      namespaceSelector reads to decide which namespaces it
#      constrains at all.
#   2. pod-security.kubernetes.io/enforce may not be removed or have
#      its value changed, once the namespace already carries it (which
#      every team namespace does, set to "restricted" by
#      gitops/bootstrap/team-onboard.sh at creation). This is the
#      control that actually stops a privileged DaemonSet or a
#      hostNetwork Pod.
#   3. pod-security.kubernetes.io/enforce-version may not be present
#      at all. Unlike rules 1-2 (which only start checking once the
#      namespace already carries the key), this one denies the key
#      outright on every UPDATE this policy governs, because
#      team-onboard.sh never sets it in the first place -- there is no
#      prior value for a "once set" rule to anchor on, and the
#      Kubernetes default (no enforce-version label) always resolves
#      to the latest Pod Security Standard definitions. A team adding
#      this label, pinned to an old version, could relax what
#      "restricted" actually disallows without ever touching either
#      value rules 1-2 already protect -- a "weaken" path through
#      exactly the surface this file exists to close, that a "once set,
#      cannot change" rule would miss entirely for a key that was never
#      set to begin with.
#
# Known, bounded scope: this does not stop an admin's own direct,
# intentional change to any of the three (there is no caller-identity
# exemption here, matching team-rbac-guard.yaml's own "no exemption of
# any kind" design -- a label-based or identity-based exemption is
# exactly the shape that guard's own history (RFC #22 Decision 10 H11)
# already found attacker-controlled once). An admin who genuinely needs
# to change distai.dev/team or pod-security.kubernetes.io/enforce --
# re-labeling a namespace to a different team, or relaxing/tightening
# its Pod Security level -- deletes team-namespace-guard-binding
# first, makes the change, and reapplies
# gitops/bootstrap/team-onboard.sh (which reapplies this file). This
# policy says nothing about annotations, or about any OTHER label a
# team's own managedNamespaceMetadata might set or remove -- only these
# three specific, security-relevant keys. resourceRules below also
# names the Namespace's own status subresource, defensively: the
# status update strategy resets ObjectMeta (other than resourceVersion)
# before this policy ever runs, so a label change through
# --subresource=status is not actually possible on Kubernetes today --
# included anyway because that is this policy's own understanding of
# an upstream implementation detail, not a statement checked against
# the real API server (this PR's own real-hardware budget was spent on
# checks 10-11 instead), and the cost of matching a request that can
# never actually change a label is zero.
#
# Scope: matchConstraints.resourceRules matches UPDATE on the core/v1
# Namespace resource and its status subresource, both cluster-scoped
# (Namespace objects are not themselves "in" a namespace, so
# namespaceSelector does not apply the way it does on
# team-rbac-guard.yaml; matchConditions below does the equivalent
# scoping by reading the OLD object's own distai.dev/team label
# directly -- deliberately NOT also gated on
# pod-security.kubernetes.io/enforce being present, which would widen
# this policy to every namespace in the cluster that happens to carry
# a Pod Security label, team-onboard.sh-created or not). failurePolicy:
# Fail, same reasoning as team-rbac-guard.yaml: a CEL evaluation
# failure should block the write, not silently let it through.
#
# Applied once, cluster-wide, by gitops/bootstrap/team-onboard.sh's own
# step 1 (idempotent `kubectl apply`, alongside team-rbac-guard.yaml) --
# never per-team, since both objects here are cluster-scoped.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: team-namespace-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["namespaces", "namespaces/status"]
  matchConditions:
    - name: old-namespace-is-a-team-namespace
      # has(...) guards every namespace with no labels at all (most
      # system namespaces, and any Namespace before this policy's
      # scope ever touches it) from ever reaching the 'key in labels'
      # check below: on a map CEL does not itself consider present,
      # that check is a CEL runtime error, not plainly false --
      # fatal here, since failurePolicy: Fail denies the write on any
      # evaluation error, which would otherwise make an ordinary
      # UPDATE to any unrelated, unlabeled namespace in the cluster
      # fail for a reason that has nothing to do with this policy.
      # Gated on distai.dev/team alone (not also on
      # pod-security.kubernetes.io/enforce): every namespace this
      # policy is meant to govern carries both, set together by
      # team-onboard.sh, so distai.dev/team alone is already a
      # complete gate -- adding an OR on the Pod Security label would
      # instead widen this policy to any OTHER namespace in the
      # cluster that happens to carry that label for an unrelated
      # reason (an add-on namespace a Helm or Terraform upgrade
      # relabels, for example), freezing its own Pod Security level
      # with a deny message that cites team-onboard.sh for a namespace
      # that script never touched.
      expression: >-
        has(oldObject.metadata.labels) &&
        'distai.dev/team' in oldObject.metadata.labels
  validations:
    - expression: >-
        !('distai.dev/team' in oldObject.metadata.labels) ||
        (has(object.metadata.labels) &&
         'distai.dev/team' in object.metadata.labels &&
         object.metadata.labels['distai.dev/team'] == oldObject.metadata.labels['distai.dev/team'])
      message: "a namespace's own distai.dev/team label may not be removed or changed once set -- gitops/bootstrap/team-rbac-guard.yaml's own namespaceSelector depends on this exact label to decide which namespaces it constrains at all (RFC #22 Decision 10 H11, issue #57 item 1, gitops/bootstrap/team-namespace-guard.yaml); use managedNamespaceMetadata to add other labels freely, or delete team-namespace-guard-binding first if this change is intentional"
    - expression: >-
        !('pod-security.kubernetes.io/enforce' in oldObject.metadata.labels) ||
        (has(object.metadata.labels) &&
         'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] == oldObject.metadata.labels['pod-security.kubernetes.io/enforce'])
      message: "a namespace's own pod-security.kubernetes.io/enforce label may not be removed or changed once set -- gitops/bootstrap/team-onboard.sh's own Namespace object sets this to 'restricted', the control that actually stops a privileged DaemonSet or a hostNetwork Pod (RFC #22 Decision 10 H11, issue #57 item 1, gitops/bootstrap/team-namespace-guard.yaml); delete team-namespace-guard-binding first if this change is intentional"
    - expression: >-
        !has(object.metadata.labels) ||
        !('pod-security.kubernetes.io/enforce-version' in object.metadata.labels)
      message: "a team namespace may not carry pod-security.kubernetes.io/enforce-version at all -- team-onboard.sh never sets it (the Kubernetes default already resolves to the latest Pod Security Standard definitions), and pinning it to an older version could relax what 'restricted' disallows without changing the enforce label's own value (RFC #22 Decision 10 H11, issue #57 item 1, gitops/bootstrap/team-namespace-guard.yaml); delete team-namespace-guard-binding first if this change is intentional"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: team-namespace-guard-binding
spec:
  policyName: team-namespace-guard
  validationActions: ["Deny"]
