# RFC #25 Decision 2/3/4. One Application per cell-specific parameter file
# under gitops/cells/<cluster-name>/{capacity-pool,smoke}/*.yaml, pointing
# at the shared chart templates in gitops/charts/ (capacity-pool, smoke) via
# a local "dir", never an upstream "chart" - these are admin-authored,
# per-cell values, not a registry add-on (Decision 2). Explicit globs, not
# one all-matching cells/{{.name}}/**/*.yaml, so a stray file under a cell's
# own directory never becomes an Application with no wave to sync in.
#
# #18 adds a third glob and RollingSync step, sharedfs
# (cells/<cluster-name>/sharedfs/*.yaml -> gitops/charts/sharedfs-shares):
# the same shape this file's own header already anticipated for #22's
# future teams/*.yaml glob, added here first because #18 needed it first.
# A separate step from "capacity", not folded into it: neither the static
# PersistentVolume/FilesystemShare objects here nor capacity-pool/smoke's
# own NodePool/ResourceFlavor depend on the other to exist at the object
# level. RollingSync is still sequential, though: a "capacity" step that
# never reaches its own success criteria DOES hold "sharedfs" back from
# syncing at all, the same as it already holds back any step ordered
# after it today - this PR accepts that coupling rather than removing it
# (a parallel, unordered step shape is a bigger change to this file's own
# RollingSync strategy than #18 needs). It is ordered after "capacity"
# (not before) only as a stable, read top-to-bottom convention - gitops/addon-catalog/
# sharedfs's own controller (a different ApplicationSet,
# addons-optional.ApplicationSet.yaml) is this step's real GitOps
# prerequisite (the FilesystemShare CustomResourceDefinition this step's
# own objects need), and that dependency crosses ApplicationSet
# boundaries, so it converges by retry (RFC #25 Decision 4), the same way
# "capacity" already converges against "controllers" in
# platform.ApplicationSet.yaml, not by this file's own step ordering.
#
# #22's own "teams" step and its own cells/<cluster-name>/teams/*.yaml
# glob are still not added here - adding the glob with no matching step
# would leave a team's own Application generated but never synced.
#
# Open question, not resolved here (#63, filed as #59 item 4): #22
# Decision 1(c) separately specifies an Argo CD Application per team
# generated from gitops/teams/<name>/ - a different layout from this
# file's own cells/<cluster-name>/teams/*.yaml glob (team identity per
# team directory, vs. per-cell quota wiring per cell). The two may be
# complementary rather than conflicting, but nothing says so yet; #22's
# own implementation is what decides whether this glob is renamed,
# dropped, or kept alongside gitops/teams/<name>/ for a different
# purpose.
#
# See platform.ApplicationSet.yaml for why goTemplate is on and why
# templatePatch is a Go template either way.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cells
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - git:
              repoURL: https://github.com/littlemex/distai-platform.git
              revision: '{{ index .metadata.annotations "distai.dev.annotations/revision" }}'
              files:
                - path: "gitops/cells/{{ .name }}/capacity-pool/*.yaml"
                - path: "gitops/cells/{{ .name }}/smoke/*.yaml"
                - path: "gitops/cells/{{ .name }}/sharedfs/*.yaml"
  # RFC #25 Decision 8: see platform.ApplicationSet.yaml.
  syncPolicy:
    preserveResourcesOnDeletion: true
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: distai.dev/wave
              operator: In
              values: ["capacity"]
        - matchExpressions:
            - key: distai.dev/wave
              operator: In
              values: ["sharedfs"]
  template:
    metadata:
      name: "{{ .name }}-{{ .addon }}"
      labels:
        distai.dev/wave: "{{ .wave }}"
        distai.dev/cell: "{{ .name }}"
    spec:
      project: platform
      source:
        repoURL: https://github.com/littlemex/distai-platform.git
        targetRevision: '{{ index .metadata.annotations "distai.dev.annotations/revision" }}'
        path: "{{ .dir }}"
      destination:
        name: "{{ .name }}"
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    spec:
      source:
        helm:
          # Same fix as platform.ApplicationSet.yaml's own releaseName
          # line (#110/PR #116), unconditionally -- none of this file's
          # own objects turned out to be release-name-derived, but the
          # fix is applied here too for consistency. See PR #116.
          releaseName: "{{ .addon }}"
          {{- if .values }}
          valuesObject:
            {{- toYaml .values | nindent 12 }}
          {{- end }}
          {{- if .valuesFrom }}
          parameters:
          {{- range .valuesFrom }}
          - name: {{ .helmKey }}
            {{- if .param }}
            value: "{{ index $ .param }}"
            {{- else }}
            value: "{{ index $.metadata.annotations .annotationKey }}"
            {{- end }}
          {{- end }}
          {{- end }}
