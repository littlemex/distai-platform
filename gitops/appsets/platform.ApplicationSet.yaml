# RFC #25 Decision 2/3/4. One Application per gitops/addons/<name>/addon.yaml,
# per registered cluster (Matrix: Cluster generator x Git FILE generator).
# Steps shipped: "crds" (karpenter-crd), "controllers" (karpenter, kueue,
# optional-pool, RFC #41 Decision 1/4) and "accelerators" (the four
# accel-* advertisers and accel-device-classes, #28); "extras" is a later
# PR's (#18, #23) and simply has no addon.yaml yet, so it generates
# nothing today.
#
# goTemplate is on (a decision this PR makes, not spelled out by the RFC's
# own prose, which quotes the legacy fasttemplate form for a single field):
# templatePatch below needs .values as a real nested object for toYaml, and
# a flat, dot-flattened legacy parameter map cannot give it that. Verified
# on a real cluster: every generated Application reaches Synced with this
# mechanism (karpenter and kueue also reach Healthy; karpenter-crd ships
# only CustomResourceDefinition objects, with no Health status of its own
# to report), confirming goTemplate plus templatePatch render correctly
# end to end (Decision 9's own reason for this PR to exist first, in
# isolation).
#
# The Cluster generator's selector excludes the capability's own built-in
# local/in-cluster entry (no registration Secret, no annotations, a
# destination this capability does not support - Facts checked): only a
# cell's own cell-registration Secret carries this label.
#
# The Git file generator's own revision is templated from the Cluster
# generator's annotation, not a literal value, so the generator-ordering
# rule (the consumer comes after the producer, Decision 1) is satisfied
# inside one Matrix generator.
#
# RollingSync is this PR's Decision-4 answer (Experiment 4: whether the
# managed capability's ApplicationSet controller actually exposes
# Progressive Syncs - Beta since Argo CD v3.3.0). Confirmed on a real
# cluster (gitops/tests/1.e2e.sh, reading this ApplicationSet's own
# status.applicationStatus): it does not, as of this PR. Every generated
# Application instead syncs independently with automated.selfHeal, and a
# later step's Application fails once and succeeds on retry against an
# earlier step that has not converged yet - the fallback this manifest's
# retry policy is already sized for. The strategy.type: RollingSync block
# below is kept rather than removed: it is harmless when unsupported (the
# controller simply ignores it, confirmed by the same real-cluster run),
# and ready to take effect the day the managed capability does expose it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - matrix:
        generators:
          # #110/PR #116: a cluster's own row is enriched (never
          # replaced) with gitops/cells/<cell>/cell.yaml's own
          # `keepLegacyReleaseNames`, if that cell has such a file --
          # the Merge generator's own base generator (clusters, listed
          # first) keeps every one of its own rows even when nothing in
          # the second generator matches it (confirmed against Argo
          # CD's own documented Merge generator semantics: "the base
          # generator's own elements are always kept... only non-base
          # elements that match nothing in the base are discarded"), so
          # a cell with no cell.yaml renders exactly as it did before
          # this leg existed. mergeKeys: ["name"] needs a literal
          # `name:` field inside cell.yaml itself (self-declaring its
          # own cell name) -- a path-derived parameter cannot be a merge
          # key. revision is a fixed literal (`main`), not the per-cell
          # `distai.dev.annotations/revision` the sibling git leg below
          # uses: a Merge generator's own children are evaluated
          # independently (unlike a Matrix's second child, which the
          # Argo CD docs for the Matrix generator specifically describe
          # as using "the parameters generated by one child generator
          # inside another child generator" -- a capability the Merge
          # generator's own docs never mention), so this leg cannot
          # reference a per-cluster-row annotation at all. A cell.yaml
          # change therefore only takes effect once merged to `main`,
          # never on a feature branch a cell happens to track --
          # documented in gitops/README.md. pathParamPrefix: cell avoids
          # this leg's own `path.*` parameters colliding with the
          # sibling addon-files leg's own `path.*` (Argo CD's documented
          # fix for "a Matrix generator where both child generators are
          # Git generators").
          - merge:
              mergeKeys: ["name"]
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        argocd.argoproj.io/secret-type: cluster
                - git:
                    repoURL: https://github.com/littlemex/distai-platform.git
                    revision: main
                    files:
                      - path: "gitops/cells/*/cell.yaml"
                    pathParamPrefix: cell
          - git:
              repoURL: https://github.com/littlemex/distai-platform.git
              revision: '{{ index .metadata.annotations "distai.dev.annotations/revision" }}'
              files:
                - path: "gitops/addons/*/addon.yaml"
  # RFC #25 Decision 8: an addon.yaml removed by a PR, or a cell briefly
  # unmatched, orphans that Application's resources (CRDs, controllers)
  # instead of deleting them. Only this field, on the ApplicationSet
  # itself, does that - not an AppProject setting.
  syncPolicy:
    preserveResourcesOnDeletion: true
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: distai.dev/wave
              operator: In
              values: ["crds"]
        - matchExpressions:
            - key: distai.dev/wave
              operator: In
              values: ["controllers"]
        - matchExpressions:
            - key: distai.dev/wave
              operator: In
              values: ["accelerators"]
  template:
    metadata:
      name: "{{ .name }}-{{ .addon }}"
      labels:
        distai.dev/wave: "{{ .wave }}"
        distai.dev/cell: "{{ .name }}"
    spec:
      project: platform
      source:
        repoURL: "{{ .repoURL }}"
        chart: "{{ .chart }}"
        targetRevision: "{{ .version }}"
      destination:
        name: "{{ .name }}"
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        retry:
          limit: 20
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
  # Always rendered as a Go template (sprig included), regardless of
  # spec.goTemplate above - the only way Decision 2's per-add-on values
  # (karpenter's settings.clusterName and so on) avoid being forced into
  # every other add-on's template. See the {{- if .dir }} branch below
  # for the dir-only (accel-device-classes, optional-pool and similar)
  # source shape, and why it sets chart: null explicitly rather than
  # leaving it unset.
  templatePatch: |
    spec:
      {{- if .dir }}
      # A local, platform-owned chart (accel-device-classes, #28;
      # optional-pool, RFC #41), never an upstream registry - same "dir"
      # shape cells.ApplicationSet.yaml already uses for capacity-pool/
      # smoke (#25 Decision 2), applied here because this addon.yaml has
      # no chart/repoURL/version. This branch is merged onto the base
      # template's own source above by templatePatch's own merge-patch
      # semantics (same mechanism the syncOptions block below this one
      # relies on), not a replacement of it - which otherwise renders
      # repoURL/chart/targetRevision all empty for a dir-only addon.yaml,
      # an invalid Application with no repoURL.
      #
      # chart: null below is explicit, NOT harmless to omit (#63, found
      # independently a second time and corrected here): the base
      # template's own chart value does not render as an empty string
      # for a dir-only addon.yaml's missing chart key (not written with
      # the live template braces here on purpose - this whole block is
      # itself rendered as a Go template, and writing them literally
      # would evaluate rather than describe). goTemplateOptions
      # missingkey=zero returns the zero value of the map's value type,
      # and for a map[string]interface{} (what a parsed addon.yaml's own
      # params decode to) that zero value is a nil interface{}, which Go's
      # text/template engine prints as the literal string "<no value>",
      # not "". A non-empty "chart: <no value>" alongside "path:" would
      # make Argo CD treat this as a (broken) Helm chart source instead of
      # a Git path source, and this Application would never sync. A JSON
      # Merge Patch "null" removes the key entirely, which is what this
      # branch actually needs. The "<no value>" half of this is confirmed
      # by reproducing Go's own text/template missingkey=zero behavior for
      # an untyped map (documented Go quirk, golang/go#24963 and widely
      # reported); the merge-patch-removes-the-key half is Argo CD's own
      # documented JSON Merge Patch semantics, not independently re-run
      # against a live Application - verify this on a real cluster before
      # relying on it (same caveat as goTemplate itself, this file's own
      # header comment).
      #
      # The dir branch also carries the chart branch's own skipCrds/
      # values/valuesFrom (#55 item 6: #28's own accel-device-classes
      # needs none of them, so every if-guard below renders
      # nothing for it; optional-pool's clusterName/nodeRole are
      # cell-specific valuesFrom entries, the same contract capacity-pool/
      # smoke already use, and do need this block).
      source:
        repoURL: https://github.com/littlemex/distai-platform.git
        path: "{{ .dir }}"
        chart: null
        targetRevision: '{{ index $.metadata.annotations "distai.dev.annotations/revision" }}'
        helm:
          # #110/PR #116: the add-on's own name, never "<cell>-<addon>"
          # (the generated Application's own metadata.name above) -- a
          # release only needs to be unique within one (cluster,
          # namespace) pair, which destination below already gives it.
          # Both of these must be true to keep the pre-#110
          # "<cell>-<addon>" name instead: selectorDerivesFromReleaseName
          # is a FACT about the add-on's own chart (accel-neuron-device-
          # plugin, accel-neuron-dra: their own charts keep a fixed
          # object name but a release-derived, immutable spec.selector,
          # so renaming would try to patch it instead of recreating),
          # and keepLegacyReleaseNames is a DECISION about the cell
          # (from gitops/cells/<cell>/cell.yaml, via the merge generator
          # above -- absent/false for every cell registered today and
          # every cell created from here on, so no cell gets this
          # exception unless it explicitly opts in). See PR #116's own
          # "## Changes"/"## Alternatives Considered" for the full
          # mechanism, breakpoints and real-cluster evidence.
          releaseName: "{{ if and .selectorDerivesFromReleaseName .keepLegacyReleaseNames }}{{ .name }}-{{ .addon }}{{ else }}{{ .addon }}{{ end }}"
          {{- if .skipCrds }}
          skipCrds: true
          {{- end }}
          {{- if .values }}
          valuesObject:
            {{- toYaml .values | nindent 12 }}
          {{- end }}
          {{- if .valuesFrom }}
          parameters:
          {{- range .valuesFrom }}
          - name: {{ .helmKey }}
            {{- if .param }}
            value: "{{ index $ .param }}"
            {{- else }}
            value: "{{ index $.metadata.annotations .annotationKey }}"
            {{- end }}
          {{- end }}
          {{- end }}
      {{- else }}
      source:
        helm:
          # Same fix and selectorDerivesFromReleaseName/
          # keepLegacyReleaseNames escape hatch as the .dir branch above
          # (#110/PR #116).
          releaseName: "{{ if and .selectorDerivesFromReleaseName .keepLegacyReleaseNames }}{{ .name }}-{{ .addon }}{{ else }}{{ .addon }}{{ end }}"
          {{- if .skipCrds }}
          skipCrds: true
          {{- end }}
          {{- if .values }}
          valuesObject:
            {{- toYaml .values | nindent 12 }}
          {{- end }}
          {{- if .valuesFrom }}
          parameters:
          {{- range .valuesFrom }}
          - name: {{ .helmKey }}
            {{- if .param }}
            value: "{{ index $ .param }}"
            {{- else }}
            value: "{{ index $.metadata.annotations .annotationKey }}"
            {{- end }}
          {{- end }}
          {{- end }}
      {{- end }}
      # templatePatch is applied as a JSON merge patch over the rendered
      # base template above (goTemplate's own semantics): a present key
      # replaces the base's list wholesale, it does not append to it. An
      # addon.yaml that sets its own syncOptions would otherwise silently
      # lose the base template's CreateNamespace=true (#63/#64) -
      # CreateNamespace=true is always rendered first here, and an
      # addon.yaml that also lists it explicitly (as gitops/addons/kueue's
      # used to, before this fix) is de-duplicated rather than repeated.
      {{- if or .syncOptions .allowEmpty }}
      syncPolicy:
        {{- if .allowEmpty }}
        # Per-addon opt-in only (RFC #41 Decision 4 Finding 1): Argo CD's
        # own automated-sync-with-prune default (allowEmpty: false)
        # refuses to sync an Application down to zero resources,
        # treating that as a likely automation/human error. optional-pool's
        # own values.enabled: false switch renders nothing on purpose, so
        # it alone sets allowEmpty: true in its own addon.yaml -- this key
        # must stay scoped to the one addon that actually needs it:
        # karpenter-crd, karpenter and kueue never render empty, and
        # giving every core addon this escape hatch would mean a future
        # Helm/OCI-registry hiccup that happened to render one of them
        # empty gets automatically pruned (CRDs, NodePools, EC2NodeClasses,
        # NodeClaims and all) instead of the safety mechanism catching it.
        automated:
          allowEmpty: true
        {{- end }}
        {{- if .syncOptions }}
        syncOptions:
        - CreateNamespace=true
        {{- range .syncOptions }}
        {{- if ne . "CreateNamespace=true" }}
        - {{ . }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
