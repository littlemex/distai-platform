---
# Source: capacity-pool/templates/ec2nodeclass.yaml
# EC2NodeClass selects the cell's own subnets and security group by the
# karpenter.sh/discovery tag the foundation layer already sets on them
# (infra/foundation/vpc.tf, infra/foundation/eks.tf) - never a hand-picked
# subnet or security group ID. metadataOptions is set explicitly (IMDSv2
# required, hop limit 1) rather than left to Karpenter's own default, per
# the foundation README's own note that every EC2NodeClass should do this
# rather than rely on the default staying what it is today.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: "cpu"
spec:
  role: "static-check-node-role"
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "static-check-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "static-check-cluster"
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

---
# Source: capacity-pool/templates/nodepool.yaml
# One NodePool per release of this chart (RFC #17: one NodePool per
# ResourceFlavor; RFC #25 Decision 9: this chart's own name and the three
# kinds it renders do not change between the minimal CPU-only skeleton and
# the -rsv/-od/-flex extension, only the values do).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: "cpu"
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: "cpu"
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
          - on-demand
        - key: kubernetes.io/arch
          operator: In
          values:
          - amd64
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
          - c
          - m
          - r
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values:
          - "5"
      terminationGracePeriod: 24h0m0s
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: "60s"

---
# Source: capacity-pool/templates/resourceflavor.yaml
# Kueue's own kind, not Karpenter's; Karpenter labels every node it
# launches with karpenter.sh/nodepool=<pool name> on its own, so this
# ResourceFlavor's nodeLabels needs no extra label on the NodePool side to
# match nodes launched from it.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: "cpu"
spec:
  nodeLabels:
    karpenter.sh/nodepool: "cpu"
