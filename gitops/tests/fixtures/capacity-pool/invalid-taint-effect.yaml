# Static-check input (0.static.sh), expected to FAIL `helm template`: a
# taint's effect must be NoSchedule, PreferNoSchedule or NoExecute, the
# three Kubernetes defines -- never a typo rendered straight into the
# NodePool/ResourceFlavor. Identical to accelerator-tenancy.yaml except
# for this one value.
clusterName: static-check-cluster
nodeRole: static-check-node-role
pool:
  name: accel-team-a
accelerator:
  taint:
    key: aws.amazon.com/neuron
    value: "present"
    effect: NoScheduleTypo
