# Static-check input (0.static.sh): pool.startupTaints (#96) as a real
# two-element list -- the shared node-readiness key
# distai.dev/startup-not-ready with no value, plus a second entry with a
# different key, a value and a different effect, so a template that only
# handles a single dict, drops the value or hardcodes the effect fails
# here. check_chart_renders.py checks the list lands unchanged in
# NodePool.spec.template.spec.startupTaints and, unlike accelerator.taint
# and tenancy.teamTaint, is never mirrored as a ResourceFlavor toleration
# nor added to NodePool.spec.template.spec.taints. Sets nothing else.
clusterName: static-check-cluster
nodeRole: static-check-node-role
pool:
  name: startup-taints
  startupTaints:
    - key: distai.dev/startup-not-ready
      effect: NoSchedule
    - key: distai.dev/startup-static-check
      value: "pending"
      effect: NoExecute
