# The EFA advertiser, Neuron-method half. See
# addons/accel-efa-device-plugin-nvidia/addon.yaml for the full rationale
# ("Two releases, not one", "A method label alone is not enough") -- this
# release is identical except for the one vendor nodeSelector key,
# selecting nodes that opted into distai.dev/neuron-method=device-plugin
# instead (for example trn2.48xlarge, which carries both EFA and multiple
# Neuron devices), ANDed with the same distai.dev/efa-attached="true"
# label capacity-pool sets only when pool.networkInterfaces is non-empty.
# For Neuron specifically this AND is not optional: every trn2 size in the
# pinned chart's own supportedInstanceLabels (trn2.3xlarge, trn2.48xlarge)
# is EFA-capable, so without this label a Neuron pool carrying the method
# label with no EFA interfaces would *always* get this chart's own Pod,
# never merely "sometimes" depending on which size Karpenter resolves to.
#
# Chart source, version, pinned image digest and the securityContext
# override: identical to accel-efa-device-plugin-nvidia/addon.yaml; not
# repeated here. The real-hardware confirmation that the override does not
# break EFA enumeration (review round 1, finding B1) was run
# against a p4d.24xlarge (NVIDIA) node only -- EFA device enumeration does
# not depend on the GPU/Neuron driver, but this release's own positive path
# (a real trn2 node) has not been separately confirmed on real hardware in
# this PR (see gitops/README.md's "Known limits").
#
# The EFA DRA driver (aws-dranet) is out of scope for both
# accel-efa-device-plugin-* releases: see gitops/README.md's "Known
# limits", and #19/#50 for where it is expected to be designed.
#
# tolerations (#96, #102) -- same reasoning as
# accel-efa-device-plugin-nvidia/addon.yaml's own tolerations comment,
# not repeated here: the #96 entry (distai.dev/startup-not-ready) is
# kept because gitops/tests/check_startup_taint_keys.py asserts on that
# literal key by name; the second, key-agnostic, effect: NoSchedule
# entry added by #102 additionally covers accelerator.taint/
# tenancy.teamTaint (and, incidentally, already subsumes the #96 entry
# at the real Kubernetes scheduler level on its own). `helm template`
# against the pinned chart with this exact two-entry value renders the
# identical three-entry list ([{key: CriticalAddonsOnly, operator:
# Exists}, {key: distai.dev/startup-not-ready, operator: Exists,
# effect: NoSchedule}, {operator: Exists, effect: NoSchedule}]) as the
# NVIDIA release -- confirmed statically; not independently re-run
# against a real trn2 node in this change.
addon: accel-efa-device-plugin-neuron
tier: core
chart: aws-efa-k8s-device-plugin
repoURL: https://aws.github.io/eks-charts
version: "v0.5.35"
wave: accelerators
namespace: kube-system
values:
  image:
    tag: "v0.5.22-eksbuild.9@sha256:a392d84ff82b23580fd92d0a6c770136c56d4a6ee979a47d1bf4e379a7171647"
  nodeSelector:
    distai.dev/neuron-method: device-plugin
    distai.dev/efa-attached: "true"
  tolerations:
    - key: distai.dev/startup-not-ready
      operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoSchedule
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    runAsNonRoot: false
    runAsUser: 0
    capabilities:
      drop: ["ALL"]
