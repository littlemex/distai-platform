# NVIDIA's device plugin: advertises nvidia.com/gpu as an extended resource
# (a Layer 1 request, #19 Decision 1) on every node whose NodePool opts into
# the device-plugin method. One of four accelerator add-ons in the
# "accelerators" step, one chart release per (vendor, method) - #25
# Decision 5's unit, #28 section A.
#
# Opt-in by method label only (#19 Decision 2): a capacity-pool NodePool
# sets distai.dev/nvidia-gpu-method=device-plugin through
# accelerator.methodLabel (gitops/charts/capacity-pool, #17's own shape),
# and this release selects exactly that label. A node labeled for the DRA
# method is never selected here, so the
# same GPU is never advertised by two advertisers at once - #19 E1 showed
# that a double advertisement silently double-allocates.
#
# affinity is replaced, not left at the chart default: the chart's default
# required node affinity matches only NFD- or GPU-Operator-set labels
# (feature.node.kubernetes.io/pci-10de.present, nvidia.com/gpu.present and
# so on - chart values.yaml, tag v0.20.2), and this platform runs neither,
# so a Karpenter-launched GPU node might carry none of them and the
# DaemonSet would schedule nothing. nodeSelectorTerms is a list, and Helm
# replaces lists rather than merging them, so the term below is the only
# one left: the method label is the single opt-in (#28 section A, "or
# equivalent chart key"). nodeSelector carries the same label as well, the
# key #28's Interface table names.
#
# Tolerations stay at the chart default (CriticalAddonsOnly,
# nvidia.com/gpu:NoSchedule), so a GPU NodePool that adds the usual
# nvidia.com/gpu taint later still gets its advertiser.
#
# Chart source: https://github.com/NVIDIA/k8s-device-plugin (tag v0.20.2),
# classic Helm repository (index.yaml, not OCI), install section of the
# upstream README, confirmed 2026-11-19 (#28, Facts checked). Default
# state (AGENTS.md section 4): always present, targets empty by default -
# with no NodePool carrying the label, the DaemonSet schedules nothing.
addon: accel-nvidia-device-plugin
# RFC #41 Decision 1 (a later, independent PR): gitops/addons/ is
# delivered unconditionally to every cell, no opt-out, and its own
# check_addon_tiers.py requires every addon.yaml here to say so
# explicitly. Added here so this PR's own add-ons do not fail that
# check once both PRs are merged (found by combining the two
# branches for a real p4d.24xlarge EFA verification run).
tier: core
chart: nvidia-device-plugin
repoURL: https://nvidia.github.io/k8s-device-plugin
version: "0.20.2"
wave: accelerators
namespace: nvidia-device-plugin
values:
  nodeSelector:
    distai.dev/nvidia-gpu-method: device-plugin
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: distai.dev/nvidia-gpu-method
                operator: In
                values: ["device-plugin"]
