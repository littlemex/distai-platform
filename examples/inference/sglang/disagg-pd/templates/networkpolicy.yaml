{{- if .Values.networkPolicy.enabled }}
{{- include "disagg.validate" . -}}
{{- $fullname := include "disagg.fullname" . -}}
{{- /*
  #63 (filed as a private report "SA2"): same gap and same convention as
  vllm/disagg-pd's own networkpolicy.yaml. The router discovers engines
  through the Kubernetes API, not a Service, but it still makes the
  actual HTTP calls directly to each engine Pod -- the engine's own
  ingress rule names the router the same way vllm/disagg-pd names its
  proxy.

  RFC #37: the peer rule below used to list only transport.bootstrapPort
  and, with sglangNixlBackend=UCX, transport.ucx.tcpPortRange -- a fixed,
  narrow port list. Read against sgl-project/sglang's own source (this
  chart's own SGLANG_BUILD_COMMIT): SGLang's own control-plane channel
  between prefill and decode (every PUT/GET in
  python/sglang/srt/disaggregation/common/conn.py, carrying each role's
  NIXL agent metadata or Mooncake session id, abort notices and
  chunk-ready signals) binds a ZMQ PULL socket on an OS-assigned,
  per-process-restart ephemeral port (get_zmq_socket_on_host ->
  bind_to_random_port, python/sglang/srt/utils/network.py) -- present on
  every prefill and every decode process, for every transport.backend
  this chart renders, with no CLI flag or env var in this SGLang version
  to pin it to a fixed value. transport.backend=MOONCAKE appears (from
  its own call into kvcache-ai/Mooncake with rpc_port=0, the standard
  "let the OS assign it" idiom, not independently traced inside that
  library) to open a second, independent ephemeral port of its own. A
  NetworkPolicy that enumerates a fixed port list can never admit a port
  that does not exist until the process has already started, confirmed on
  real hardware with a CPU stand-in reproduction (RFC #37): the old,
  fixed-list rule blocks a plain TCP listener between the peer-labeled
  stand-ins on a port the list does not name, and the podSelector-only
  rule below admits it, while an unlabeled client and a same-named peer
  from a different release both stay blocked throughout. One earlier real
  round on this chart (two nodes, NIXL/LIBFABRIC, reported in this
  chart's own README Status section) served real traffic successfully
  under the old, narrower rule; whether NetworkPolicy enforcement was
  actually verified on that round's own cluster was not recorded there
  either, so that success does not establish the old rule was sufficient
  -- this is left open, not reconciled, the same way the README's own
  `kubectl get networkpolicy --all-namespaces` discrepancy is. Either way,
  the podSelector, not the port list, is what should scope this ingress
  to this release's own peer role; a port list can only narrow what that
  role may reach, never who counts as that role, so removing it widens
  which ports the peer role may use (including engine.port, previously
  router-only) without widening who the peer role is.
  transport.ucx.tcpPortRange still exists and is still rendered into the
  engine's own environment (values.yaml), unchanged: it still fixes which
  ports NIXL's UCX backend actually uses, which still matters outside
  this chart (a VPC security group, an external firewall); it no longer
  has to be, and is not, read by this template.
*/}}
---
# prefill and decode engines: the HTTP port (engine.port) only from this
# release's own router; every port, with no port list, only from the
# PEER role's own Pods (see the comment above for why a port list cannot
# work here).
{{- range $role := list "prefill" "decode" }}
{{- $peer := ternary "decode" "prefill" (eq $role "prefill") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $role }}
  labels:
    {{- include "disagg.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  podSelector:
    matchLabels:
      {{- include "disagg.selector" (dict "root" $ "component" $role) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "disagg.selector" (dict "root" $ "component" "router") | nindent 14 }}
      ports:
        - port: {{ $.Values.engine.port }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "disagg.selector" (dict "root" $ "component" $peer) | nindent 14 }}
    {{- if and $.Values.metrics.enabled $.Values.networkPolicy.metricsScrapeFrom }}
    - from:
        {{- toYaml $.Values.networkPolicy.metricsScrapeFrom | nindent 8 }}
      ports:
        - port: {{ $.Values.engine.port }}
    {{- end }}
{{- end }}
---
# router: its own port only from the shared load-replay driver, same
# convention as vllm/disagg-pd's own proxy rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-router
  labels:
    {{- include "disagg.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  podSelector:
    matchLabels:
      {{- include "disagg.selector" (dict "root" $ "component" "router") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: load-replay
      ports:
        - port: {{ .Values.router.port }}
{{- end }}
