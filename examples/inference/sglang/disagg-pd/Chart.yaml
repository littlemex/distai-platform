apiVersion: v2
name: sglang-disagg-pd
description: >-
  SGLang prefill/decode disaggregated serving: a prefill Deployment and a
  decode Deployment that move the KV cache with SGLang's own disaggregation
  transfer backend (NIXL over libfabric/EFA by default, or Mooncake), behind
  SGLang's own router (sgl-model-gateway) finding both roles through the
  Kubernetes API. Prefill and decode never share a node by default.
type: application
version: 0.1.0
appVersion: "v0.5.23"
home: https://github.com/littlemex/distai-platform
sources:
  - https://github.com/littlemex/distai-platform
  - https://github.com/sgl-project/sglang
  - https://docs.sglang.io/advanced_features/pd_disaggregation.html
