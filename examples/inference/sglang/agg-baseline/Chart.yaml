name: sglang-agg-baseline
description: >-
  SGLang aggregated serving baseline: one Deployment whose engines run
  prefill and decode in the same process, with mixed chunked prefill turned
  on and an explicit chunk size, and no disaggregation. The comparison point
  for the disagg-pd chart on the same hardware.
