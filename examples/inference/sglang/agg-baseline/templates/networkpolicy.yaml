{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "agg.fullname" . -}}
{{- /*
  #63 (filed as a private report "SA2"): same gap and same fix as
  vllm/agg-baseline's own networkpolicy.yaml.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "agg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agg.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: load-replay
      ports:
        # engine.port, not service.port -- see vllm/agg-baseline's own
        # networkpolicy.yaml comment for why (a NetworkPolicy's own
        # ports[] matches the Pod's containerPort, never the Service's).
        - port: {{ .Values.engine.port }}
    {{- if and .Values.metrics.enabled .Values.networkPolicy.metricsScrapeFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsScrapeFrom | nindent 8 }}
      ports:
        - port: {{ .Values.engine.port }}
    {{- end }}
{{- end }}
