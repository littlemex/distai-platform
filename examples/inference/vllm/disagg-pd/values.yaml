# Defaults are the safe shape: prefill and decode on different nodes, KV
# transfer over libfabric on EFA, libfabric's own same-host behavior left
# untouched, every Service cluster-internal.

image:
  repository: vllm/vllm-openai
  # The -efa variant of the vLLM release image is built with vLLM's KV
  # connectors (NIXL) and the AWS EFA userspace (libfabric) that NIXL's
  # LIBFABRIC backend loads. Pinned by tag and by digest (multi-arch index).
  tag: v0.34.0-efa
  digest: sha256:c5248ff7ce6296602c730c646e8d53a42bea62bd43d60541c7076ba795ec975a
  pullPolicy: IfNotPresent

model:
  # Hugging Face model repository id. No default: the engines refuse to start
  # (with a message saying so) until it is set.
  name: ""
  # Commit or tag of the model repository; empty means the default branch.
  # Pin it for any measurement, so two runs serve the same weights.
  revision: ""
  # Name clients send as "model"; empty means model.name.
  servedModelName: ""
  # Secret holding a Hugging Face token, for gated models. Empty: no token.
  hfTokenSecret:
    name: ""
    key: token

# Extended resource the accelerator device plugin advertises.
accelerator:
  resourceName: nvidia.com/gpu

placement:
  # Node label key that tells prefill nodes from decode nodes. Each role
  # selects nodes where this key equals its own nodeSelectorValue, unless
  # sameNodeMeasurement overrides both to sharedPoolValue (below).
  nodeSelectorKey: distai.dev/pd-role
  # false (default): both roles keep their own nodeSelectorValue (prefill,
  # decode), so they can never land on the same node (two different pools).
  # true: both roles' nodeSelector instead targets sharedPoolValue, a single
  # shared pool. Pair with a pool whose NodePool.spec.limits is sized to fit
  # both roles' combined request on exactly one instance, so Karpenter cannot
  # launch a second node for it; combined with enforceAntiAffinity below,
  # this is what makes the fault-injection and same-node measurement cells
  # possible at all.
  sameNodeMeasurement: false
  sharedPoolValue: shared
  # true (default): a required pod anti-affinity rule on kubernetes.io/hostname,
  # rendered on the decode Deployment only (never on both roles - a required
  # term on both can leave neither schedulable, each waiting on a peer that
  # is itself waiting), keeps decode off any node running a prefill pod of
  # this release. false: that rule is dropped. If sameNodeMeasurement is also
  # true, a required pod affinity (toward prefill) is rendered on decode
  # instead, to actively pull it onto prefill's own node rather than merely
  # permitting it.
  enforceAntiAffinity: true
  tolerations: []

transport:
  # NIXL backend for the KV transfer: LIBFABRIC (EFA) or UCX.
  backend: LIBFABRIC
  # With LIBFABRIC, FI_PROVIDER=efa and FI_EFA_USE_DEVICE_RDMA=1 are always
  # set. libfabric's EFA provider still moves a same-host transfer over its
  # shared-memory path by default. true sets FI_EFA_ENABLE_SHM_TRANSFER=0 on
  # prefill and decode, which forces even a same-host transfer onto the EFA
  # device. false sets it to 1 explicitly, matching the library default
  # (stated rather than left unset).
  #
  # Observed on real hardware (g7.48xlarge, 2026-11-20, placement.sameNodeMeasurement,
  # each role's Pod already holding its own distinct physical EFA interface):
  # both values moved identical, nonzero EFA traffic - a measurement, not a
  # theory. The likely reason (not separately confirmed) is that Kubernetes'
  # EFA device plugin never lets two Pods share one physical interface, and
  # libfabric's shm bypass is keyed to both endpoints resolving to the SAME
  # device; a difference in IPC/shared-memory namespace between two separate
  # Pods was not ruled out either. See the disagg-pd chart's own README,
  # "Known issues", before relying on this value for a shm-vs-EFA comparison.
  forceEfaSameNode: false
  # Extended resource the EFA device plugin advertises.
  efaResourceName: vpc.amazonaws.com/efa
  # NIXL handshake port (VLLM_NIXL_SIDE_CHANNEL_PORT); the pod IP is the host.
  sideChannelPort: 5600
  # What a decode engine does when it cannot load a transferred KV cache:
  # "fail" returns an error, "recompute" silently runs the prefill again on
  # decode (and hides a broken transfer from every measurement).
  kvLoadFailurePolicy: fail
  # Merged into kv_connector_extra_config next to "backends".
  extraConnectorConfig: {}

# One engine is one vLLM server process with gpusPerEngine GPUs (tensor
# parallel degree). Total GPUs = prefill.replicas x prefill.gpusPerEngine +
# decode.replicas x decode.gpusPerEngine; the ratio is free.
prefill:
  replicas: 1
  gpusPerEngine: 1
  # EFA devices per engine pod. Required by the LIBFABRIC backend.
  efaDevices: 1
  nodeSelectorValue: prefill
  extraNodeSelector: {}
  resources:
    requests:
      cpu: "4"
      memory: 32Gi
  extraArgs: []
  extraEnv: []

decode:
  replicas: 1
  gpusPerEngine: 1
  efaDevices: 1
  nodeSelectorValue: decode
  extraNodeSelector: {}
  resources:
    requests:
      cpu: "4"
      memory: 32Gi
  extraArgs: []
  extraEnv: []

engine:
  port: 8000
  # Shared memory for tensor-parallel workers (/dev/shm, memory-backed).
  shmSizeLimit: 16Gi
  # Model download cache. emptyDir re-downloads on every pod start; replace
  # with a persistent volume source to keep the weights across restarts.
  cacheVolume:
    emptyDir: {}
  # Model download and load time allowed before the engine is restarted.
  startupTimeoutSeconds: 1800
  # The vLLM image provides a non-root "vllm" user (UID 2000, GID 0) for
  # exactly this; its home and cache directories are group-writable.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

proxy:
  replicas: 1
  port: 8000
  # How often the proxy re-resolves the prefill and decode pod addresses.
  resolveIntervalSeconds: 5
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# The client-facing Service, in front of the proxy. ClusterIP: reachable only
# from inside the cluster. The engines have no authentication of their own.
service:
  type: ClusterIP
  port: 8000

metrics:
  # Adds the vllm-metrics=true pod label and the prometheus.io/* annotations
  # that the "vllm" scrape job in examples/inference/_shared/dashboards/
  # scrape-configs.yaml selects on. vLLM serves /metrics on the engine port.
  enabled: true

# Skeleton only (values and rendering, not built or measured on real
# hardware in this chart yet): where the KV cache lives, as three tiers that
# stack, not three exclusive choices. A disagg-pd release always needs
# NixlConnector for the mandatory prefill-to-decode handshake (Decision 6),
# so a tier beyond "gpu-only" here means stacking LMCacheMPConnector onto
# that same MultiConnector list (vLLM's own confirmed stacking shape,
# docs.vllm.ai "disaggregated prefilling", fetched 2026-11-21), never
# replacing NixlConnector. "LMCacheMPConnector" (not "LMCacheConnector") is
# the confirmed registered connector name for LMCache's current "mp server"
# integration (vLLM's own vllm/distributed/kv_transfer/kv_connector/factory.py
# register_connector calls, fetched 2026-11-21; that file also registers a
# separate, older "LMCacheConnectorV1" this chart does not use).
#   gpu-only (default): no change from today - NixlConnector only, no
#     cache tiering, vLLM's own GPU-resident KV cache only.
#   local / remote: both add LMCacheMPConnector, pointed at ONE LMCache
#     "mp server" endpoint via kv_connector_extra_config's
#     "lmcache.mp.host"/"lmcache.mp.port" (confirmed,
#     docs.lmcache.ai/mp/configuration.html, fetched 2026-11-21). This
#     chart's own vLLM-side rendering is IDENTICAL for local and remote,
#     and mode does NOT actually select between a node-local and an
#     off-node backend: kvCacheTier.lmcache.mpServerEndpoint is a single
#     static value, rendered the same way into every prefill and decode
#     Pod, which by Decision 3 run on DIFFERENT nodes - so this chart has
#     no way to express "a separate mp server local to each node" at all,
#     only "one shared mp server address every Pod dials." Whichever
#     backend that one mp server's own adapter configuration (its own CLI
#     flags, e.g. --l2-adapter, not rendered here) actually uses - genuinely
#     node-local storage, or something off-node like Amazon ElastiCache -
#     is entirely that external process's own property, invisible to and
#     unenforced by this chart. "local"/"remote" are kept as two words of
#     this directory's own measurement vocabulary (matching the names
#     used elsewhere for SGLang HiCache's genuinely distinct L1/L2/L3), to
#     be recorded by hand alongside whichever backend the mp server was
#     actually given for that run - not as a value this chart's rendering
#     can tell apart or enforce.
#
# NOT built here, stated rather than silently assumed: (1) whether the
# pinned vllm/vllm-openai:v0.34.0-efa image's own bundled LMCache version
# actually speaks this "mp server" shape, or an older, different config
# shape some other LMCache integration write-ups describe (chunk_size,
# remote_url, remote_serde and similar in-process fields) - follow-up issue
# B's own first real-machine check, before trusting the shape above.
# (2) whether LMCache's current RESP (Redis/Valkey) adapter's TLS behavior
# is compatible with what Amazon ElastiCache's distributed KV caching
# feature needs - that adapter's own docs do not mention TLS at all
# (checked 2026-11-21). (3) vLLM's own KV-event publisher (consumed by
# llm-d-kv-cache-manager's indexer for cross-node routing, Decision 11)
# describes vLLM's own GPU-resident block pool only, confirmed by reading
# vLLM's KV-event code path - it has no visibility into anything
# LMCacheMPConnector holds. Since the remote tier above is one shared
# endpoint every Pod can already reach directly, this gap does not block
# a hit on that tier (no "the node that holds it" to route to); what it
# actually causes is the indexer/EPP's own reuse scoring under-counting
# what is reusable at all (it only ever sees GPU-resident hits, never an
# LMCache one), and it would block routing outright for a genuinely
# node-local tier, if one is ever actually built (see (1) above - this
# chart does not build one today). Not solved here either way. (4) SGLang
# has no confirmed Redis/ElastiCache L3 backend as of this writing
# (docs.sglang.io/advanced_features/hicache_design.html lists Mooncake,
# DeepSeek 3FS, NIXL, AIBrix KVCache, file/fast_file - no RESP/Redis entry),
# even though AWS's own ElastiCache announcement names SGLang as a
# supported engine via a LMCache connector - this chart does not reconcile
# that discrepancy, and treats SGLang's own upstream docs as the more
# specific, more current source for what SGLang itself actually ships;
# this tiering is vLLM-only here until that changes or is otherwise
# confirmed.
#
# Prerequisite this chart does not provide: an LMCache mp server already
# running and reachable at kvCacheTier.lmcache.mpServerEndpoint. If that
# server's own L2 adapter points at Amazon ElastiCache (or anything else
# off-node), that deployment's own endpoint, VPC/subnet-count and TLS
# requirements are this prerequisite's own responsibility, not this
# chart's - no ElastiCache (or other backing store) Terraform ships here.
kvCacheTier:
  mode: gpu-only
  lmcache:
    # host:port of LMCache's own separate "mp server" process (see this
    # block's own comment above), for example "10.0.1.23:5555" (5555 is
    # LMCache's own confirmed default mp port). No scheme: the chart
    # prepends tcp:// itself (LMCache's own mp.host requires one -
    # docs.lmcache.ai/mp/configuration.html) and fails to render if this
    # value already has one, rather than silently mis-parsing it. Required
    # whenever mode != gpu-only, for BOTH local and remote - this chart's
    # own rendering does not change between them beyond that requirement.
    # Empty: mode != gpu-only fails to render rather than silently running
    # with no connector at all.
    mpServerEndpoint: ""
    # Merged into kv_connector_extra_config as-is. Unconfirmed beyond
    # lmcache.mp.host/lmcache.mp.port above - see (1) in this block's own
    # comment before relying on any key here.
    extraConfig: {}
