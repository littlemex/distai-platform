# Defaults are the safe shape: prefill and decode on different nodes, KV
# transfer over libfabric on EFA, libfabric's own same-host behavior left
# untouched, every Service cluster-internal.

image:
  repository: vllm/vllm-openai
  # The -efa variant of the vLLM release image is built with vLLM's KV
  # connectors (NIXL) and the AWS EFA userspace (libfabric) that NIXL's
  # LIBFABRIC backend loads. Pinned by tag and by digest (multi-arch index).
  tag: v0.34.0-efa
  digest: sha256:c5248ff7ce6296602c730c646e8d53a42bea62bd43d60541c7076ba795ec975a
  pullPolicy: IfNotPresent

model:
  # Hugging Face model repository id. No default: the engines refuse to start
  # (with a message saying so) until it is set.
  name: ""
  # Commit or tag of the model repository; empty means the default branch.
  # Pin it for any measurement, so two runs serve the same weights.
  revision: ""
  # Name clients send as "model"; empty means model.name.
  servedModelName: ""
  # Secret holding a Hugging Face token, for gated models. Empty: no token.
  hfTokenSecret:
    name: ""
    key: token

# Extended resource the accelerator device plugin advertises.
accelerator:
  resourceName: nvidia.com/gpu

placement:
  # Node label key that tells prefill nodes from decode nodes. Each role
  # selects nodes where this key equals its own nodeSelectorValue, unless
  # sameNodeMeasurement overrides both to sharedPoolValue (below).
  nodeSelectorKey: distai.dev/pd-role
  # false (default): both roles keep their own nodeSelectorValue (prefill,
  # decode), so they can never land on the same node (two different pools).
  # true: both roles' nodeSelector instead targets sharedPoolValue, a single
  # shared pool. Pair with a pool whose NodePool.spec.limits is sized to fit
  # both roles' combined request on exactly one instance, so Karpenter cannot
  # launch a second node for it; combined with enforceAntiAffinity below,
  # this is what makes the fault-injection and same-node measurement cells
  # possible at all.
  sameNodeMeasurement: false
  sharedPoolValue: shared
  # true (default): a required pod anti-affinity rule on kubernetes.io/hostname,
  # rendered on the decode Deployment only (never on both roles - a required
  # term on both can leave neither schedulable, each waiting on a peer that
  # is itself waiting), keeps decode off any node running a prefill pod of
  # this release. false: that rule is dropped. If sameNodeMeasurement is also
  # true, a required pod affinity (toward prefill) is rendered on decode
  # instead, to actively pull it onto prefill's own node rather than merely
  # permitting it.
  enforceAntiAffinity: true
  tolerations: []

transport:
  # NIXL backend for the KV transfer: LIBFABRIC (EFA) or UCX.
  backend: LIBFABRIC
  # With LIBFABRIC, FI_PROVIDER=efa and FI_EFA_USE_DEVICE_RDMA=1 are always
  # set. libfabric's EFA provider still moves a same-host transfer over its
  # shared-memory path by default. true sets FI_EFA_ENABLE_SHM_TRANSFER=0 on
  # prefill and decode, which forces even a same-host transfer onto the EFA
  # device. false sets it to 1 explicitly, matching the library default
  # (stated rather than left unset).
  #
  # Confirmed on real hardware (g7.48xlarge, 2026-11-20): this value has no
  # observable effect when placement.sameNodeMeasurement puts both roles on
  # one node, because Kubernetes' EFA device plugin gives each role's Pod
  # its own, different physical EFA interface (it never lets two Pods share
  # one) - libfabric's shm bypass is keyed to both endpoints resolving to
  # the SAME device, which never happens here, so both values move
  # identical EFA traffic. See the disagg-pd chart's own README, "Known
  # issues", before relying on this value for a shm-vs-EFA comparison.
  forceEfaSameNode: false
  # Extended resource the EFA device plugin advertises.
  efaResourceName: vpc.amazonaws.com/efa
  # NIXL handshake port (VLLM_NIXL_SIDE_CHANNEL_PORT); the pod IP is the host.
  sideChannelPort: 5600
  # What a decode engine does when it cannot load a transferred KV cache:
  # "fail" returns an error, "recompute" silently runs the prefill again on
  # decode (and hides a broken transfer from every measurement).
  kvLoadFailurePolicy: fail
  # Merged into kv_connector_extra_config next to "backends".
  extraConnectorConfig: {}

# One engine is one vLLM server process with gpusPerEngine GPUs (tensor
# parallel degree). Total GPUs = prefill.replicas x prefill.gpusPerEngine +
# decode.replicas x decode.gpusPerEngine; the ratio is free.
prefill:
  replicas: 1
  gpusPerEngine: 1
  # EFA devices per engine pod. Required by the LIBFABRIC backend.
  efaDevices: 1
  nodeSelectorValue: prefill
  extraNodeSelector: {}
  resources:
    requests:
      cpu: "4"
      memory: 32Gi
  extraArgs: []
  extraEnv: []

decode:
  replicas: 1
  gpusPerEngine: 1
  efaDevices: 1
  nodeSelectorValue: decode
  extraNodeSelector: {}
  resources:
    requests:
      cpu: "4"
      memory: 32Gi
  extraArgs: []
  extraEnv: []

engine:
  port: 8000
  # Shared memory for tensor-parallel workers (/dev/shm, memory-backed).
  shmSizeLimit: 16Gi
  # Model download cache. emptyDir re-downloads on every pod start; replace
  # with a persistent volume source to keep the weights across restarts.
  cacheVolume:
    emptyDir: {}
  # Model download and load time allowed before the engine is restarted.
  startupTimeoutSeconds: 1800
  # The vLLM image provides a non-root "vllm" user (UID 2000, GID 0) for
  # exactly this; its home and cache directories are group-writable.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

proxy:
  replicas: 1
  port: 8000
  # How often the proxy re-resolves the prefill and decode pod addresses.
  resolveIntervalSeconds: 5
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# The client-facing Service, in front of the proxy. ClusterIP: reachable only
# from inside the cluster. The engines have no authentication of their own.
service:
  type: ClusterIP
  port: 8000

metrics:
  # Adds the vllm-metrics=true pod label and the prometheus.io/* annotations
  # that the "vllm" scrape job in examples/inference/_shared/dashboards/
  # scrape-configs.yaml selects on. vLLM serves /metrics on the engine port.
  enabled: true

# Skeleton only (values and rendering, not built or measured on real
# hardware in this chart yet): where the KV cache lives, as three tiers that
# stack, not three exclusive choices. Chosen per the LMCache/vLLM MultiConnector
# shape confirmed from vLLM's own docs (docs.vllm.ai, "disaggregated prefilling",
# fetched 2026-11-21): a disagg-pd release always needs NixlConnector for the
# mandatory prefill-to-decode handshake (Decision 6), so a tier beyond
# "gpu-only" here means stacking LMCacheConnector onto that same
# MultiConnector list, never replacing NixlConnector.
#   gpu-only (default): no change from today - NixlConnector only, no
#     cache tiering, vLLM's own GPU-resident KV cache only.
#   local: adds LMCacheConnector with a node-local backend (CPU RAM or
#     local NVMe); still not shared across nodes or across aggregated
#     replicas, the same as SGLang HiCache's own L1+L2 (confirmed,
#     docs.sglang.io/advanced_features/hicache_design.html, fetched
#     2026-11-21: "L2 is node-local and instance-exclusive; no instance
#     reads another instance's L2").
#   remote: local, plus an off-node backend every prefill/decode pod (or
#     every aggregated replica) can read, the only tier that lets a prefix
#     computed on one node be reused on another. Confirmed shape for vLLM
#     via LMCache's own current docs (docs.lmcache.ai/mp/l2_storage/resp.html,
#     fetched 2026-11-21): LMCache's "mp" server process holds the RESP
#     (Redis/Valkey-protocol) adapter config and credentials
#     (LMCACHE_RESP_HOST/PORT/USERNAME/PASSWORD env vars on that server,
#     not on the vLLM container); the vLLM-side LMCacheConnector only needs
#     that server's own host/port (kv_connector_extra_config's
#     "lmcache.mp.host"/"lmcache.mp.port"). This chart does not yet render
#     that separate "mp" server process - remote.endpoint below is carried
#     through to the LMCacheConnector config as a placeholder for it, named
#     here rather than silently assumed; follow-up issue B's own real-
#     machine run settles whether the "mp" server needs its own
#     Deployment/sidecar in this chart or can run outside it.
#
# NOT built here, stated rather than silently assumed: (1) which exact
# LMCache config shape the pinned image's own LMCache version actually
# speaks - two different shapes are documented across sources checked
# 2026-11-21 (an older in-process LMCacheConnector config with
# remote_url/remote_serde/save_unfull_chunk fields, versus the current
# docs.lmcache.ai "mp server" + --l2-adapter shape above); which one the
# vllm/vllm-openai:v0.34.0-efa image's own bundled LMCache speaks is
# unconfirmed and is follow-up issue B's own first check, before trusting
# any value below. (2) whether Amazon ElastiCache's new distributed KV
# caching feature's own TLS requirement (rediss://) is compatible with the
# RESP adapter config above - LMCache's own RESP page does not document TLS
# at all (checked 2026-11-21); a prior, unrelated integration (ElastiCache
# Serverless, a different product mode, confirmed EFA-incapable by a public
# source predating this feature) needed `rediss://` and had certificate
# verification disabled automatically - whether any of that transfers to
# this feature's own dedicated cache.i8ge.48xlarge nodes is not confirmed
# here. (3) SGLang has no confirmed Redis/ElastiCache L3 backend as of this
# writing (docs.sglang.io/advanced_features/hicache_design.html lists
# Mooncake, DeepSeek 3FS, NIXL, AIBrix KVCache, file/fast_file - no RESP/
# Redis entry) - the "remote" tier is vLLM-only until that changes or is
# otherwise confirmed.
kvCacheTier:
  mode: gpu-only
  lmcache:
    # Must be identical on every engine that shares a remote tier - a real
    # LMCache compatibility requirement (confirmed independently by two
    # separate real-world integration write-ups, both 2026-11-20/21).
    chunkSize: 256
    hashAlgorithm: sha256
    # local: cpu or disk. Required even when mode=remote (the remote tier
    # adds to, not replaces, a local buffer - confirmed by the same two
    # write-ups above).
    localBackend: cpu
    remote:
      # host:port of LMCache's own "mp" server (or, if follow-up issue B's
      # own check finds the pinned image speaks the older in-process shape
      # instead, a redis://|rediss:// URL there instead - this chart does
      # not pre-judge which). Empty: mode=remote fails to render rather
      # than silently running with no remote tier at all.
      endpoint: ""
      enableTls: true
    extraConfig: {}
