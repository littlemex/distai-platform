# Defaults are the safe shape: prefill and decode on different nodes, KV
# transfer over libfabric on EFA, libfabric's own same-host behavior left
# untouched, every Service cluster-internal. Same value names as the NVIDIA
# chart ../../disagg-pd wherever the concept is the same; the parts that
# differ for Neuron (image, accelerator unit, compile cache, the absence of
# MPS) are named for what they are, not shared under a GPU name.

image:
  # The vLLM Neuron plugin's own Deep Learning Container: vLLM 0.29.0 with
  # the plugin 0.29.0.1.2.0, Neuron SDK 2.33.1, and the AWS EFA userspace
  # (libfabric, under /opt/amazon/efa) that NIXL's LIBFABRIC backend loads.
  # Not the NVIDIA vllm/vllm-openai image with a flag: a separate build.
  repository: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx
  tag: 0.29.0.1.2.0-neuronx-py314-sdk2.33.1-ubuntu26.04
  # Confirmed against the registry's own v2 manifest API (Docker-Content-Digest
  # header on a GET of this exact tag, 2026-11-26) -- a metadata-only query,
  # the same thing `docker manifest inspect`/`crane digest` do, not a layer
  # pull. Single-platform manifest (this image is not a multi-arch index).
  digest: "sha256:7e44e4f610c37bd0db785154d9ce44d78deafcadd0cd3a04e3dd6ca8b6eb8a88"
  pullPolicy: IfNotPresent

model:
  # Hugging Face model repository id. No default: the engines refuse to start
  # (with a message saying so) until it is set.
  name: ""
  # Commit or tag of the model repository; empty means the default branch.
  # Pin it for any measurement, so two runs serve the same weights.
  revision: ""
  # Name clients send as "model"; empty means model.name.
  servedModelName: ""
  # Secret holding a Hugging Face token, for gated models. Empty: no token.
  hfTokenSecret:
    name: ""
    key: token

accelerator:
  # Extended resource the Neuron device plugin advertises
  # (gitops/addons/accel-neuron-device-plugin). One unit is one whole Neuron
  # device (chip), not one NeuronCore: a trn2.3xlarge node reports
  # aws.amazon.com/neuron: 1. This platform requests devices, never
  # aws.amazon.com/neuroncore, because Karpenter overestimates neuroncore
  # capacity on trn2.3xlarge (8 estimated where the node reports 4; see that
  # add-on's own comment).
  resourceName: aws.amazon.com/neuron
  # NeuronCores one device exposes at the default logical NeuronCore
  # configuration: 4 on Trainium2 (one trn2.3xlarge device = 4 cores). Each
  # engine requests ceil(neuronCoresPerEngine / coresPerDevice) devices.
  # Set it for a different generation or logical NeuronCore setting.
  coresPerDevice: 4

placement:
  # Node label key that tells prefill nodes from decode nodes. Each role
  # selects nodes where this key equals its own nodeSelectorValue, unless
  # sameNodeMeasurement overrides both to sharedPoolValue (below). The key
  # does not encode the accelerator type; on this platform's capacity-pool
  # nodes, karpenter.sh/nodepool (set by Karpenter on every node it
  # launches) selects one pool per role with no extra node label (README,
  # Prerequisites).
  nodeSelectorKey: distai.dev/pd-role
  # false (default): both roles keep their own nodeSelectorValue (prefill,
  # decode), so they can never land on the same node (two different pools).
  # true: both roles' nodeSelector instead targets sharedPoolValue, a single
  # shared pool. Pair with a pool whose NodePool.spec.limits is sized to fit
  # both roles' combined request on exactly one instance, so Karpenter cannot
  # launch a second node for it; combined with enforceAntiAffinity below,
  # this is what makes the fault-injection and same-node measurement cells
  # possible at all.
  sameNodeMeasurement: false
  sharedPoolValue: shared
  # true (default): a required pod anti-affinity rule on kubernetes.io/hostname,
  # rendered on the decode Deployment only (never on both roles - a required
  # term on both can leave neither schedulable, each waiting on a peer that
  # is itself waiting), keeps decode off any node running a prefill pod of
  # this release. false: that rule is dropped. If sameNodeMeasurement is also
  # true, a required pod affinity (toward prefill) is rendered on decode
  # instead, to actively pull it onto prefill's own node rather than merely
  # permitting it.
  enforceAntiAffinity: true
  # This platform's Neuron capacity pools carry the taint
  # aws.amazon.com/neuron=true:NoSchedule
  # (gitops/cells/dp-a19-trn-r3/capacity-pool/trn.yaml), so a release
  # against such a pool sets the matching toleration here (README,
  # Prerequisites). Empty by default, like the NVIDIA chart, because the
  # taint belongs to the pool, not to this chart.
  tolerations: []

transport:
  # NIXL backend for the KV transfer: LIBFABRIC (EFA) or UCX. The vLLM
  # Neuron plugin documents LIBFABRIC only (docs/tutorials/
  # tutorial-di-1p1d-xpyd.md); UCX is kept for value-shape parity with the
  # NVIDIA chart and has not been run on Neuron.
  backend: LIBFABRIC
  # With LIBFABRIC, FI_PROVIDER=efa and FI_EFA_USE_DEVICE_RDMA=1 are always
  # set. libfabric's EFA provider still moves a same-host transfer over its
  # shared-memory path by default. true sets FI_EFA_ENABLE_SHM_TRANSFER=0 on
  # prefill and decode, which forces even a same-host transfer onto the EFA
  # device. false sets it to 1 explicitly, matching the library default
  # (stated rather than left unset). The plugin's own tutorial requires 0
  # for same-node disaggregation ("without it, both servers can start
  # successfully but requests can produce inaccurate output"), which is a
  # stronger statement than the NVIDIA chart's own measurement; this chart
  # still only allows true together with placement.sameNodeMeasurement,
  # because a cross-node transfer already goes over the EFA device.
  forceEfaSameNode: false
  # Extended resource the EFA device plugin advertises. The same name on
  # Neuron nodes as on GPU nodes: accel-efa-device-plugin-neuron installs
  # the same upstream chart as the NVIDIA release.
  efaResourceName: vpc.amazonaws.com/efa
  # NIXL handshake port (VLLM_NIXL_SIDE_CHANNEL_PORT); the pod IP is the host.
  sideChannelPort: 5600
  # What a decode engine does when it cannot load a transferred KV cache:
  # "fail" returns an error, "recompute" silently runs the prefill again on
  # decode (and hides a broken transfer from every measurement).
  kvLoadFailurePolicy: fail
  # NIXL's own kv_role for the engines: "kv_both" (default, matches the
  # NVIDIA chart's own disagg-pd) runs each role as a server that can
  # produce and consume KV, at the plugin's own documented cost -- a decode
  # engine also keeps its prefill weights loaded and compiles prefill's
  # graph (vllm_neuron.vllm.platform.py's decode_only_weights is false for
  # kv_both). "producer_consumer" renders the plugin's own tutorial shape
  # instead (kv_producer on prefill, kv_consumer on decode), skipping that
  # cost; real-hardware verification has not yet confirmed either shape's
  # own NIXL path on Neuron. Any other value fails the render.
  kvRoleMode: kv_both
  # Merged into kv_connector_extra_config next to "backends".
  extraConnectorConfig: {}
  # Only read with backend=UCX. Same meaning and same 4096-port cap as the
  # NVIDIA chart's transport.ucx.tcpPortRange (see ../../disagg-pd/
  # values.yaml for the UCX sources): fixes the TCP port UCX's own TCP
  # transport listens on, so the peer role's NetworkPolicy can name it.
  ucx:
    tcpPortRange: "20000-20063"

# One engine is one vLLM server process with neuronCoresPerEngine
# NeuronCores (its tensor parallel degree). The device plugin allocates whole
# devices, so each engine pod requests ceil(neuronCoresPerEngine /
# accelerator.coresPerDevice) aws.amazon.com/neuron devices; cores of an
# allocated device beyond neuronCoresPerEngine stay idle. NEURON_VISIBLE_DEVICES
# is never set: the plugin's tutorial uses it for host-level NeuronCore
# numbering on a bare instance and says to leave it unset under Kubernetes
# and size the resource request instead; the device plugin already exposes
# only the allocated devices to the container. There is no MPS or memory
# fraction value: both are NVIDIA-only.
# Compile cache, mounted at /compile-cache with VLLM_CACHE_ROOT pointing at
# it. Neuron-only, no NVIDIA counterpart: on the plugin's native
# torch.compile route, Torch's caching-precompile cache saves the traced
# graphs under $VLLM_CACHE_ROOT/neuron/torch_compile/ so that a warm start
# skips tracing, and the compiled artifacts land under the same root unless
# another cache variable is set (vllm-project/vllm-neuron, docs/guides/
# how-to-precompile-cache.md). That guide also says the cache is off unless
# VLLM_NEURON_BACKEND is set explicitly (the server uses the native route
# either way), so the engines render VLLM_NEURON_BACKEND=neuron_native; set
# TORCH_CACHING_PRECOMPILE=0 in extraEnv to turn the cache off.
#
# Set per role, not once under engine.*: prefill and decode run on separate
# nodes (Decision 3), so a single shared field pointing both roles at the
# same PersistentVolumeClaim name would hand two Pods on two different
# nodes the same claim -- a multi-attach failure for any access mode that
# is not many-writer (e.g. ReadWriteOnce). Two independent fields, each
# defaulting to its own emptyDir, means a PVC override on one role never
# forces a shared name on the other; a reader who does want to share a
# volume across roles still can, explicitly, by naming the same claim in
# both. emptyDir re-traces and recompiles on every pod restart, exactly
# like engine.cacheVolume re-downloads weights; a deployment that restarts
# engines often should use one PersistentVolumeClaim per role. The plugin's
# own guide also states that multi-node precompile is not coordinated yet,
# so do not point multiple REPLICAS of the same role (prefill.replicas > 1)
# at one shared volume either.
prefill:
  replicas: 1
  neuronCoresPerEngine: 1
  # EFA devices per engine pod. Required by the LIBFABRIC backend.
  efaDevices: 1
  nodeSelectorValue: prefill
  extraNodeSelector: {}
  resources:
    requests:
      cpu: "4"
      memory: 32Gi
  extraArgs: []
  extraEnv: []
  compileCacheVolume:
    emptyDir: {}

decode:
  replicas: 1
  neuronCoresPerEngine: 1
  efaDevices: 1
  nodeSelectorValue: decode
  extraNodeSelector: {}
  resources:
    requests:
      cpu: "4"
      memory: 32Gi
  extraArgs: []
  extraEnv: []
  compileCacheVolume:
    emptyDir: {}

engine:
  port: 8000
  # Shared memory for tensor-parallel workers (/dev/shm, memory-backed).
  shmSizeLimit: 16Gi
  # Model download cache (HF_HOME=/cache/huggingface). emptyDir re-downloads
  # on every pod start; replace with a persistent volume source to keep the
  # weights across restarts.
  cacheVolume:
    emptyDir: {}
  # Model download, compile and load time allowed before the engine is
  # restarted. A cold start on Neuron compiles the model first.
  startupTimeoutSeconds: 1800
  # This image declares no USER and ships no dedicated non-root account
  # (its image config, checked 2026-11-26), unlike the vLLM image the NVIDIA
  # chart runs as UID 2000. The chart still runs the engines non-root with
  # the same UID/GID, and gives the process a writable HOME and a USER name
  # (template): a UID with no /etc/passwd entry otherwise gets HOME=/, which
  # it cannot write, and Python's getpass.getuser(), which Torch uses to
  # name its compile cache directory, fails without a USER variable.
  # Whether UID 2000 can open the Neuron device files is a real-hardware
  # check (README, Known issues).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

proxy:
  replicas: 1
  port: 8000
  # How often the proxy re-resolves the prefill and decode pod addresses.
  resolveIntervalSeconds: 5
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# The client-facing Service, in front of the proxy. ClusterIP: reachable only
# from inside the cluster. The engines have no authentication of their own.
service:
  type: ClusterIP
  port: 8000

metrics:
  # Adds the vllm-metrics=true pod label and the prometheus.io/* annotations
  # that the "vllm" scrape job in examples/inference/_shared/dashboards/
  # scrape-configs.yaml selects on. vLLM serves /metrics on the engine port;
  # whether the Neuron plugin exposes every metric the NVIDIA dashboards
  # read is not confirmed.
  enabled: true

networkPolicy:
  # Default deny, name the exception (#63): with this off, any Pod in the
  # cluster, in any namespace, can call an engine's HTTP port or its NIXL
  # side channel directly, skipping the proxy the README calls the
  # boundary. On by default. Same policy as ../../disagg-pd.
  enabled: true
  # Ingress peers (NetworkPolicy spec.ingress[].from shape) allowed to scrape
  # metrics on engine.port. See ../../disagg-pd/values.yaml for the full
  # reasoning: empty means metrics are not reachable while networkPolicy is
  # enabled, and opening engine.port opens the whole engine API to that
  # peer, not only /metrics.
  metricsScrapeFrom: []

# Skeleton only, the same shape and the same mode names as
# ../../disagg-pd/values.yaml's own kvCacheTier (see that comment for the
# LMCache sources and for why local and remote render identically). The
# mode name "gpu-only" is kept as is so tooling that reads kvCacheTier.mode
# sees one vocabulary across both accelerators; here it means "KV cache on
# the accelerator only", NIXL alone. Nothing in LMCache's or the Neuron
# plugin's documentation states that LMCacheMPConnector runs on Neuron:
# local/remote render, but are unverified on Neuron in every respect. Inside
# a MultiConnector list the NIXL entry is rendered as NeuronNixlConnector
# with its module path, because the plugin only rewrites a top-level
# NixlConnector to its Neuron subclass (templates/engines.yaml).
kvCacheTier:
  mode: gpu-only
  lmcache:
    # host:port of LMCache's own separate "mp server" process, no scheme.
    mpServerEndpoint: ""
    # Merged into kv_connector_extra_config as-is.
    extraConfig: {}
