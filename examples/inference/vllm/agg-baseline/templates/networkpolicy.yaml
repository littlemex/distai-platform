{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "agg.fullname" . -}}
{{- /*
  #63 (filed as a private report "SA2"): no NetworkPolicy ships for this
  chart either, so the engine is reachable from any Pod in the cluster,
  in any namespace -- this chart has no proxy to even claim as a
  boundary. Default deny, name the exception: the only legitimate caller
  is the shared load-replay driver.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "agg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agg.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: load-replay
      ports:
        - port: {{ .Values.service.port }}
{{- end }}
