{{- if .Values.serviceAccount.create }}
{{- /*
  The identity the training Pods run as. It carries no Kubernetes RBAC of
  its own (the Pods never call the Kubernetes API). Its only purpose is to
  be the target of an EKS Pod Identity association, created outside this
  chart by whoever administers the cell, that maps it to an IAM role
  allowing s3:ListBucket on the checkpoint bucket and s3:GetObject /
  s3:PutObject on the checkpoint prefix only (README "Prerequisites").
  Without that association the Pods start, find no credentials, and exit
  on the first S3 call.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "ddp.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
