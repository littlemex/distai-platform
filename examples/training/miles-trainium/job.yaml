# Runs train_grpo.py (mounted from a ConfigMap of the same name in this directory) on one
# trn2.3xlarge node: sgl-project/sglang-neuron serves Qwen3-0.6B for rollout (all four
# NeuronCores, --tp-size 4, the plugin's own validated flags for this model size), a CPU
# transformers copy of the same model trains. nodeSelector/toleration/resource match this
# platform's capacity-pool + accel-neuron-device-plugin pattern (README.md "Accelerators";
# aws.amazon.com/neuron, never aws.amazon.com/neuroncore).
#
# karpenter.sh/do-not-disrupt: a defensive opt-out for this one workload. This platform's own
# capacity-pool/trn.yaml fixture documents a prior, separate real-machine finding on this same
# NodePool shape (a pod evicted while a multi-GB image was still pulling, root-caused there to
# Karpenter consolidation) and raises consolidateAfter to mitigate it; this annotation is a
# narrower, per-pod version of the same mitigation. During this PR's own three real-machine
# attempts (README.md "What actually ran"), the only one that reached a node also saw one
# TaintManagerEviction event -- not confirmed as the same cause, since no controller log line
# was captured for it either way.
#
# The ConfigMap (miles-trainium-script) is generated from train_grpo.py by 0.verify.sh, so the
# two copies of the script (this file's mount and the Job that runs it) never drift apart; see
# that script for the exact kubectl commands.
apiVersion: batch/v1
kind: Job
metadata:
  name: miles-trainium-grpo
  namespace: distai-smoke
  labels:
    app: miles-trainium-grpo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: miles-trainium-grpo
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      restartPolicy: Never
      nodeSelector:
        distai.dev/neuron-method: device-plugin
      tolerations:
        - key: aws.amazon.com/neuron
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: ecr-public-pull
      containers:
        - name: grpo
          image: public.ecr.aws/neuron/pytorch-inference-sglang-neuron:v0.1.0-neuron-py314-sdk-2.33.0-ubuntu26.04
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "[setup] pip install transformers requests huggingface_hub"
              pip install -q --no-cache-dir "transformers==5.24.1" "requests==2.34.2" "huggingface_hub==2.4.0"
              echo "[setup] downloading Qwen/Qwen3-0.6B"
              python3 -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Qwen/Qwen3-0.6B', local_dir='/models/Qwen3-0.6B')"
              echo "[setup] starting train_grpo.py"
              python3 /opt/rl/train_grpo.py
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_HOME
              value: /models/_hf-cache
            - name: BASE_MODEL_DIR
              value: /models/Qwen3-0.6B
            - name: WORK_DIR
              value: /models/_steps
            - name: STEPS
              value: "2"
            - name: GROUP_SIZE
              value: "4"
            - name: MAX_NEW_TOKENS
              value: "24"
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              aws.amazon.com/neuron: "1"
            limits:
              cpu: "8"
              memory: "40Gi"
              aws.amazon.com/neuron: "1"
          volumeMounts:
            - name: script
              mountPath: /opt/rl
            - name: models
              mountPath: /models
      volumes:
        - name: script
          configMap:
            name: miles-trainium-script
        - name: models
          emptyDir:
            sizeLimit: 40Gi
