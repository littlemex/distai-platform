# Expected Neuron/EFA hardware per instance type, for this tool's own three
# checks (issue #97). This tool's own format, not a vendored one: there is no
# upstream Neuron health-check suite whose table this could extend (see
# README.md "Why nothing is vendored").
#
#   INSTANCE_TYPE|DEVICE_COUNT|NEURONCORE_COUNT|EFA_COUNT
#
# INSTANCE_TYPE     the node's node.kubernetes.io/instance-type label value.
# DEVICE_COUNT      Neuron devices neuron-ls must list (check 0).
# NEURONCORE_COUNT  nc_count neuron-ls must report for each device (check 0),
#                   in the node's default logical-NeuronCore configuration.
# EFA_COUNT         EFA PCI functions lspci must list (check 2).
#
# Sources, per field -- every number below is measured or read from a
# committed fixture in this repository, none is estimated:
#
#   trn2.3xlarge DEVICE_COUNT=1, NEURONCORE_COUNT=4: issue #19's E4a/E4b
#     real-hardware runs on a trn2.3xlarge in ap-southeast-4 (2026-11-18):
#     the Neuron device plugin advertised aws.amazon.com/neuron: 1 and
#     aws.amazon.com/neuroncore: 4, and neuron-ls showed device 0 with 4
#     cores. Karpenter's own instance-type data estimates
#     aws.amazon.com/neuroncore: 8 for this type; the same measurement shows
#     that estimate is wrong for the node's default configuration (two
#     physical cores are grouped into one logical core), so
#     NEURONCORE_COUNT here is the measured 4, not Karpenter's 8.
#   trn2.3xlarge EFA_COUNT=1: EfaInfo.MaximumEfaInterfaces in
#     gitops/charts/capacity-pool/tools/fixtures/trn2.3xlarge.describe.json
#     (a real `aws ec2 describe-instance-types` response, _source.capturedUtc
#     2026-11-25, ap-southeast-4), cross-checked against
#     GROUND_TRUTH["trn2.3xlarge"] = (1, 1) in gitops/tests/check_nic_layout.py
#     (documented order (MaximumNetworkCards, MaximumEfaInterfaces); this row
#     uses the second element). tests/0.static.sh re-checks both sources.
#     This is the type's maximum; a pool that deliberately attaches fewer EFA
#     interfaces always reads as a mismatch here (README.md states why).
#
# Add a row only with the same kind of source for every field (a real
# measurement, or a committed fixture), never a guessed value. Other Neuron
# types (trn2.48xlarge, trn1, inf2) are not listed yet for that reason.
trn2.3xlarge|1|4|1
