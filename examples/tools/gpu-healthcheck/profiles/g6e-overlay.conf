# This platform's own addition to the vendored instance-profiles.conf
# (issue #30). Format is upstream's own (see
# ../vendor/awsome-distributed-ai/instance-profiles.conf):
#
#   INSTANCE_TYPE|GPU_COUNT|EFA_COUNT|NVLINK_EXPECTED|EFA_PROVIDER
#
# Two different kinds of source, not one -- see README.md's own "Instance
# profiles: extended, not re-derived" section for the full explanation:
#   GPU_COUNT, NVLINK_EXPECTED: AWS's own published instance-type
#     specification (a documentation page: https://aws.amazon.com/ec2/instance-types/g6e/).
#     L40S carries no NVLink fabric, hence "false" for both rows.
#   EFA_COUNT: measured, not read from a doc page -- issue #50's
#     `pool.networkInterfaces` generator captured a real
#     `aws ec2 describe-instance-types` response per type and committed it
#     as a fixture:
#       g6e.12xlarge: gitops/charts/capacity-pool/tools/fixtures/g6e.12xlarge.describe.json
#         (_source.capturedUtc 2026-11-25), EfaInfo.MaximumEfaInterfaces=1,
#         cross-checked against GROUND_TRUTH["g6e.12xlarge"] = (1, 1) in
#         gitops/tests/check_nic_layout.py (the table's own documented order
#         is (MaximumNetworkCards, MaximumEfaInterfaces) -- this row uses the
#         second element).
#       g6e.48xlarge: gitops/charts/capacity-pool/tools/fixtures/g6e.48xlarge.describe.json,
#         EfaInfo.MaximumEfaInterfaces=4, cross-checked against
#         GROUND_TRUTH["g6e.48xlarge"] = (4, 4).
#     This is the instance type's maximum EFA count; a pool that deliberately
#     attaches fewer always reads as a mismatch here (README.md's own
#     instance-profile table states this explicitly).
#
# Neither type has an upstream- or officially-published NCCL bus-bandwidth
# floor, and this tool does not run check 5 at all (see README.md's "NCCL
# bandwidth is out of scope for this pre-flight") -- no floor is invented or
# recorded here for either reason.
g6e.12xlarge|4|1|false|efa
g6e.48xlarge|8|4|false|efa
