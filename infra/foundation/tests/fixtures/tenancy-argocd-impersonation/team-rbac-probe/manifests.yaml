# Fixture for infra/foundation/tests/4.argocd-impersonation.sh (issue #22
# Decision 10 H11, issue #57 item 1). Stands in for the kind of
# self-authored, namespaced RBAC a real chart ships alongside its own
# workload (the exact shape issue #57 found in
# examples/inference/vllm/disagg-pd-llmd/templates/sidecar-rbac.yaml: a
# ServiceAccount plus a same-namespace Role/RoleBinding for a sidecar).
#
# Used for the "a team project refuses this" check: gitops/bootstrap/team-onboard.sh's
# own AppProject deliberately does NOT whitelist Role/RoleBinding
# (#22 Decision 10 H11's original deny, restored after this test's own
# real-hardware finding that Argo CD sync impersonation is not actually
# engaged on the EKS managed Argo CD capability -- see
# infra/foundation/tests/4.argocd-impersonation.sh's own header). A chart
# shipping this exact shape is therefore expected to be refused by a
# team's own project today; plain-workload-probe/manifests.yaml (no
# RBAC) is the fixture used for the checks where a self-service sync is
# expected to succeed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe-sidecar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: probe-sidecar-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: probe-sidecar-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: probe-sidecar-role
subjects:
  - kind: ServiceAccount
    name: probe-sidecar
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-config
data:
  hello: "world"
