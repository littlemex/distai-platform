          sudo install -m 0755 "${RUNNER_TEMP}/shellcheck-${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run examples/inference/tests/0.static.sh
        run: bash examples/inference/tests/0.static.sh

