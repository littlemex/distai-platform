name: Neuron CPU-mode compile check

# Compiles a tiny model to a Neuron NEFF on the GitHub-hosted runner itself,
# with no Trainium/Inferentia hardware present. This is a cheap, CPU-only
# static check that runs on every pull request; it does not replace the
# real-hardware accelerator check in gitops/tests/1.e2e.sh
# (GITOPS_RUN_ACCEL_E2E=1, documented in gitops/tests/README.md), which is
# the only check that proves a real trn2.3xlarge node and the Neuron device
# plugin work end to end.
#
# Compiling without the device present is an officially documented Neuron
# SDK workflow, not something this workflow invented:
#
# - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/compiler/neuronx-cc/how-to-generate-neff.html
#   "A target instance family: one of trn1, trn1n, inf2, or trn2. You can
#   run the compilation step on any EC2 instance or on-premises host."
# - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/archive/frameworks/torch/torch-neuronx/api-reference-guide/inference/api-torch-neuronx-trace.html
#   documents torch_neuronx.trace()'s own cpu_backend=True keyword
#   ("tracing can be done completely on CPU").
#
# The AWS Neuron deep learning containers (for example
# public.ecr.aws/neuron/pytorch-inference-neuronx) were considered instead
# of the pip install below, to match this repository's accelerator add-ons
# more closely; at the pinned tag used elsewhere in this repository's e2e
# test instructions, that image is ~7.5 GiB compressed (measured against
# the public.ecr.aws registry on 2026-11-26), too large for a GitHub-hosted
# runner's ~14 GiB of free disk alongside the repository checkout and the
# runner's own pre-installed tooling. The pip wheels below total under 1
# GiB and install in under a minute.
#
# The Neuron driver (aws-neuronx-dkms, a kernel module) is never installed
# -- it has nothing to attach to on a GitHub-hosted runner with no Neuron
# device, and this workflow's cited "how to generate a NEFF" prerequisites
# do not list it as required for compilation.
#
# The Neuron runtime library (aws-neuronx-runtime-lib, a plain userspace
# .so, no kernel module) IS installed, found the hard way on a real run of
# this workflow (2026-11-26): torch_neuronx's own __init__ chain
# (torch_xla -> torch_neuronx.xla.init() -> enable_neuron_custom_calls())
# unconditionally ctypes.CDLLs a PJRT plugin library that dynamically
# links against libnrt.so.1, before cpu_backend=True ever comes into
# play, regardless of the NEURON_INTERNAL_SKIP_LIBNRT_CHECK=1 escape
# hatch the compile script itself sets (which only skips a separate,
# earlier Python-level path check inside libneuronxla). The package
# being present on disk is enough; nothing here ever opens a real
# Neuron device.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    name: compile a tiny model (no Trainium/Inferentia hardware)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the Neuron runtime library (no driver, no kernel module)
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo install -m 0755 -d /etc/apt/keyrings
          wget -qO - https://apt.repos.neuron.amazonaws.com/GPG-PUB-KEY-AMAZON-AWS-NEURON.PUB \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/neuron.gpg
          echo "deb [signed-by=/etc/apt/keyrings/neuron.gpg] https://apt.repos.neuron.amazonaws.com ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/neuron.list > /dev/null
          sudo apt-get update -y
          # Same Neuron 2.33 runtime line as the compiler/framework pins
          # below; aws-neuronx-dkms (the driver) is deliberately not
          # installed, see this workflow's own header comment.
          sudo apt-get install -y aws-neuronx-runtime-lib=2.35.*

      - name: Install the Neuron compiler and CPU-only TorchNeuron packages
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/neuron-cpu-compile-venv"
          source "${RUNNER_TEMP}/neuron-cpu-compile-venv/bin/activate"
          python -m pip install --upgrade pip
          # Versions match the "PyTorch 2.9.0" tab of the official manual
          # install guide (setup/pytorch/manual.rst in the Neuron SDK docs
          # repository): neuronx-cc pinned to the Neuron 2.33 compiler
          # minor line, torch-neuronx pinned to the exact last build that
          # shipped for PyTorch 2.9 (XLA support for this package line
          # ended at Neuron 2.31). The CPU wheel index keeps the "torch"
          # and "torch-xla" dependencies this package declares off the
          # default CUDA build (not needed to compile for Trainium, and
          # several hundred MiB larger).
          python -m pip install \
            "neuronx-cc==2.28.*" \
            "torch-neuronx==2.9.0.2.15.32035" \
            --extra-index-url https://pip.repos.neuron.amazonaws.com \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Compile a tiny model to a NEFF
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/neuron-cpu-compile-venv/bin/activate"
          python3 .github/scripts/neuron_cpu_compile_check.py --target trn2
